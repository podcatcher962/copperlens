<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCB 看板 CopperLens — 只读查线</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel2:#232733; --line:#313644;
    --fg:#e6e9ef; --fg2:#9aa3b2; --fg3:#6b7484;
    --accent:#f0b429; --accent2:#4a8ee8; --danger:#e2504f; --ok:#4caf7d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font:13px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:210px 1fr;height:100%}
  header{grid-column:1/3;display:flex;flex-direction:column;gap:6px;padding:6px 12px 7px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;gap:8px;min-width:0}
  header .brand{font-weight:600;letter-spacing:.3px;white-space:nowrap;font-size:14px}
  header .brand em{font-style:normal;color:var(--fg3);font-weight:400;font-size:12px;
    margin-left:6px;letter-spacing:0}
  /* 标题栏作者署名 */
  header .by{color:var(--fg3);font-size:11.5px;white-space:nowrap;
    letter-spacing:.2px;user-select:none}
  /* 顶部菜单：说明 / 免责 / 关于 */
  .menu{display:flex;align-items:center;gap:2px;margin-left:8px}
  .mbtn{background:none;border:none;color:var(--fg2);font-family:inherit;font-size:12.5px;
    padding:4px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .mbtn:hover{background:var(--panel2);color:var(--fg)}
  .lang{display:flex;align-items:center;gap:5px;padding:4px 10px;font-size:12.5px}
  .lang .globe{font-size:14px;line-height:1}
  /* 画布右侧的移动方向盘 */
  .navpad{position:absolute;right:16px;bottom:52px;display:grid;
    grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px);gap:3px;z-index:7}
  .navpad button{background:#1b2029e6;border:1px solid #333b4a;color:#b9c3d1;
    border-radius:6px;font-size:14px;line-height:1;cursor:pointer;padding:0;
    font-family:inherit;transition:.1s;backdrop-filter:blur(3px)}
  .navpad button:hover{background:#28313e;color:#fff;border-color:#4a5668}
  .navpad button:active{background:#39465a}
  .navpad .c{font-size:15px;color:var(--accent)}
  /* 弹窗 */
  .modal{position:fixed;inset:0;background:#000a;display:none;z-index:40;
    align-items:center;justify-content:center;padding:24px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    max-width:760px;width:100%;max-height:82vh;display:flex;flex-direction:column;
    box-shadow:0 20px 60px #000a}
  .modal .hd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .modal .hd h2{font-size:15px;font-weight:600;flex:1}
  .modal .hd button{background:none;border:none;color:var(--fg2);font-size:20px;
    cursor:pointer;line-height:1;padding:0 4px}
  .modal .hd button:hover{color:var(--fg)}
  .modal .bd{padding:16px 20px;overflow-y:auto;font-size:13px;line-height:1.75;color:var(--fg2)}
  .modal .bd p.dim{color:var(--fg3, #8a8f98);font-size:12px}
  .modal .bd h3{color:var(--fg);font-size:13px;margin:14px 0 6px;font-weight:600}
  .modal .bd h3:first-child{margin-top:0}
  .modal .bd b{color:var(--fg);font-weight:500}
  .modal .bd ul{margin:4px 0 4px 18px}
  .modal .bd li{margin:3px 0}
  .modal .bd code{background:#0f1216;border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--accent)}
  .modal .bd .sig{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);
    color:var(--fg3);font-size:12px;text-align:right}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:5px 11px;cursor:pointer;font-size:13px;font-family:inherit;transition:.12s;white-space:nowrap}
  .btn:hover{background:#2c3140;border-color:#3d4353}
  .btn.on{background:#3a3320;border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:#2f4a6d;border-color:#3f6ea8;color:#cfe0f7}
  .btn.primary:hover{background:#365579}
  header .spacer{flex:1}
  header .file{color:var(--fg2);font-size:12px;max-width:340px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  select#boards{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font-family:inherit;font-size:12px;max-width:330px;cursor:pointer}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  aside h3{font-size:11px;font-weight:500;color:var(--fg3);letter-spacing:1px;
    margin:14px 0 6px;text-transform:uppercase}
  aside h3:first-child{margin-top:0}
  /* 图层快捷：全选 / 全不选 / 只看顶底铜 / 反选 */
  .lybar{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 7px}
  .lybar button{background:var(--panel2);border:1px solid var(--line);color:var(--fg2);
    border-radius:5px;font-size:11.5px;font-family:inherit;padding:4px 2px;cursor:pointer;
    transition:.12s;white-space:nowrap}
  .lybar button:hover{background:#2c3140;color:var(--fg);border-color:#3d4353}
  .lybar button:active{background:#39465a}
  /* 顶栏搜索：位号 / 型号 / 网络名 */
  .findwrap{position:relative;flex:none;width:196px}
  .findwrap input{width:100%;box-sizing:border-box;background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12.5px;
    font-family:inherit;outline:none}
  .findwrap input:focus{border-color:var(--accent2)}
  .findwrap input::placeholder{color:var(--fg3)}
  .findwrap input::-webkit-search-cancel-button{filter:invert(.6)}
  .findlist{position:absolute;right:0;top:calc(100% + 5px);width:290px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 16px 40px #000c;
    max-height:360px;overflow-y:auto;display:none;z-index:35}
  .findlist.show{display:block}
  .findlist .it{display:flex;align-items:baseline;gap:8px;padding:6px 11px;cursor:pointer;
    font-size:12.5px}
  .findlist .it:hover,.findlist .it.sel{background:var(--panel2)}
  .findlist .it .k{color:var(--fg);font-weight:500;white-space:nowrap}
  .findlist .it .s{color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;flex:1}
  .findlist .it .tag{color:var(--fg3);font-size:10.5px;border:1px solid var(--line);
    border-radius:4px;padding:0 4px;flex:none}
  .findlist .grp{padding:6px 11px 2px;font-size:10.5px;color:var(--fg3);letter-spacing:.6px}
  .findlist .empty{padding:10px 11px;color:var(--fg3);font-size:12px}
  /* 「通不通」结论横幅 */
  .probebar{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:none;
    align-items:center;gap:9px;padding:8px 13px;border-radius:9px;background:var(--panel);
    border:1px solid var(--line);box-shadow:0 10px 30px #000b;font-size:12.5px;color:var(--fg);
    z-index:12;max-width:calc(100% - 44px)}
  .probebar.show{display:flex}
  .probebar .rd{font-weight:600;white-space:nowrap}
  .probebar .ok{color:var(--ok)}
  .probebar .bad{color:var(--danger)}
  .probebar .warn{color:var(--accent)}
  .probebar .end{color:var(--fg2);max-width:260px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .probebar .x{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:16px;
    line-height:1;padding:0 2px;font-family:inherit}
  .probebar .x:hover{color:var(--fg)}
  .layer{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:5px;
    cursor:pointer;user-select:none;margin-bottom:1px}  .layer:hover{background:var(--panel2)}
  .layer .sw{width:11px;height:11px;border-radius:2px;flex:none}
  .layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .layer .ct{color:var(--fg3);font-size:11px;font-variant-numeric:tabular-nums}
  .layer.off{opacity:.35}
  .layer.solo{background:#2a2f3c;box-shadow:inset 2px 0 0 var(--accent)}
  #optDim .nm,#optPen .nm,#optVal .nm{color:var(--fg3)}
  #optDim.on .nm,#optPen.on .nm,#optVal.on .nm{color:var(--fg)}
  #optDim.on::after,#optPen.on::after,#optVal.on::after{content:"✓";color:var(--ok);font-size:11px}
  main{position:relative;overflow:hidden;background:#0d0f12}
  canvas{display:block;position:absolute;inset:0}
  .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;color:var(--fg2);pointer-events:none}
  .hint .big{font-size:17px;color:var(--fg)}
  .hint .drop{border:2px dashed var(--line);border-radius:14px;padding:34px 56px;
    transition:.15s}
  .hint.over .drop{border-color:var(--accent);background:#f0b42910}
  .hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;font-family:inherit;font-size:12px;color:var(--fg)}
  footer{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:5px 12px;
    background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--fg2);
    min-height:30px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
  footer b{color:var(--fg);font-weight:400}
  .chip{background:#f0b42920;color:var(--accent);border:1px solid #f0b42955;
    border-radius:4px;padding:1px 7px;font-size:12px}
  .chip.warn{background:#e2504f20;color:#f09a99;border-color:#e2504f55}
  .chip.blue{background:#4a8ee820;color:#9cc4f5;border-color:#4a8ee855}
  /* 状态栏里的几个 chip 紧挨着会读成一串，留 5px 缝 */
  #stNet{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
  /* 在线版的隐私说明：这一条必须显眼，否则没人敢往网页里拖公司板子 */
  .privacy{margin-top:12px;padding:7px 14px;border-radius:999px;font-size:13px;
    color:#8fe0a8;background:#1f6b3a22;border:1px solid #2f8f5066}
  input[type=file]{display:none}
  .sep{width:1px;height:18px;background:var(--line)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#333846;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#3f4556}
  .toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);
    background:#2a1420;border:1px solid #6b2b3a;color:#f0a0a0;padding:9px 16px;
    border-radius:8px;max-width:70%;font-size:12.5px;display:none;z-index:9}
  .toast.show{display:block}
  /* 鼠标悬停时跟着走的脚位标签 */
  .tip{position:absolute;left:0;top:0;pointer-events:none;display:none;z-index:8;
    background:#1a1f27;border:1px solid #3d4757;border-radius:5px;
    padding:3px 7px;font:11.5px ui-monospace,Consolas,monospace;color:#ffd23f;
    white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .tip b{color:#8fd0ff;font-weight:600}
  .tip .v{color:#9aa5b5;margin-left:5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="brand"><span data-i18n="brandName">PCB 看板</span><em data-i18n="brandSub">CopperLens</em></div>
      <div class="by" data-i18n="author">© 永远的兰兰</div>
      <nav class="menu">
        <button class="mbtn" data-modal="help" data-i18n="menuHelp">使用说明</button>
        <button class="mbtn" data-modal="disc" data-i18n="menuDisc">免责声明</button>
        <button class="mbtn" data-modal="about" data-i18n="menuAbout">关于</button>
      </nav>
      <div class="spacer"></div>
      <div class="file" id="fname" data-i18n="notLoaded">未载入文件</div>
      <button class="btn lang" id="lang" title="English / 中文">
        <span class="globe">🌐</span><span id="langTxt">EN</span>
      </button>
    </div>
    <div class="hrow">
      <button class="btn primary" id="open" data-i18n="btnOpen"
              data-i18n-title="btnOpenTip">打开文件</button>
      <input type="file" id="file" accept=".pcb,.PCB,.ddb,.DDB">
      <select id="boards" style="display:none"></select>
      <div class="sep"></div>
      <button class="btn" id="fit" data-i18n="btnFit" data-i18n-title="btnFitTip">适合窗口</button>
      <button class="btn" id="invert" data-i18n="btnInvert">反色</button>
      <button class="btn on" id="des" data-i18n="btnDes" data-i18n-title="btnDesTip">位号</button>
      <button class="btn on" id="labels" data-i18n="btnLabels" data-i18n-title="btnLabelsTip">焊盘号</button>
      <button class="btn on" id="pour" data-i18n="btnPour" data-i18n-title="btnPourTip">覆铜</button>
      <div class="sep"></div>
      <button class="btn" id="probe" data-i18n="btnProbe" data-i18n-title="btnProbeTip">通不通</button>
      <button class="btn" id="shot" data-i18n="btnShot" data-i18n-title="btnShotTip">存图</button>
      <div class="spacer"></div>
      <div class="findwrap">
        <input id="find" type="search" autocomplete="off" spellcheck="false"
               data-i18n-ph="findPh" placeholder="找位号 / 型号 / 网络">
        <div class="findlist" id="findList"></div>
      </div>
    </div>
  </header>

  <aside>
    <h3 data-i18n="asideLayers">图层</h3>
    <div class="lybar" id="lybar">
      <button data-ly="all"  data-i18n="lyAll"  data-i18n-title="lyAllTip">全选</button>
      <button data-ly="none" data-i18n="lyNone" data-i18n-title="lyNoneTip">全不选</button>
      <button data-ly="cu"   data-i18n="lyCu"   data-i18n-title="lyCuTip">顶底铜</button>
      <button data-ly="inv"  data-i18n="lyInv"  data-i18n-title="lyInvTip">反选</button>
    </div>
    <div id="layers"></div>
    <h3 data-i18n="asideView">视图</h3>
    <div class="layer" id="optDim"><span class="nm" data-i18n="optDim">高亮时其余变暗</span></div>
    <div class="layer" id="optPen"><span class="nm" data-i18n="optPen">按真实线宽</span></div>
    <div class="layer" id="optVal"><span class="nm" data-i18n="optVal">显示型号 / 值</span></div>
  </aside>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="probebar" id="probeBar"></div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast"></div>
    <div class="tip" id="tip"></div>
    <div class="navpad" id="navpad">
      <span></span>
      <button data-nav="up" data-i18n-title="navUp" title="上移">▲</button>
      <span></span>
      <button data-nav="left" data-i18n-title="navLeft" title="左移">◀</button>
      <button data-nav="center" class="c" data-i18n-title="navCenter" title="回到中心">◎</button>
      <button data-nav="right" data-i18n-title="navRight" title="右移">▶</button>
      <span></span>
      <button data-nav="down" data-i18n-title="navDown" title="下移">▼</button>
      <span></span>
    </div>
  </main>

  <footer>
    <span><span data-i18n="stCoord">坐标</span> <b id="stCoord">—</b> mil</span>
    <span><span data-i18n="stLayer">层</span> <b id="stLayer">—</b></span>
    <span><span data-i18n="stWidth">线宽</span> <b id="stWidth">—</b></span>
    <span id="stNet"></span>
    <div class="spacer" style="flex:1"></div>
    <span id="stStats">—</span>
    <span><span data-i18n="stZoom">缩放</span> <b id="stZoom">—</b></span>
  </footer>
</div>

<!-- ============ 弹窗：使用说明 / 免责声明 / 关于 ============ -->
<div class="modal" id="mo-help">
  <div class="box">
    <div class="hd"><h2 data-i18n="menuHelp">使用说明</h2>
      <button data-close="help">×</button></div>
    <div class="bd" id="bd-help"></div>
  </div>
</div>
<div class="modal" id="mo-disc">
  <div class="box">
    <div class="hd"><h2 data-i18n="menuDisc">免责声明</h2>
      <button data-close="disc">×</button></div>
    <div class="bd" id="bd-disc"></div>
  </div>
</div>
<div class="modal" id="mo-about">
  <div class="box">
    <div class="hd"><h2 data-i18n="menuAbout">关于</h2>
      <button data-close="about">×</button></div>
    <div class="bd" id="bd-about"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   界面文案（中 / 英）
   切换只改文案，不动数据。所有界面文字都从这里取，代码里不再写死中文。
   ============================================================ */
const L = {
zh:{
  menuHelp:"使用说明", menuDisc:"免责声明", menuAbout:"关于",
  brandName:"PCB 看板", brandSub:"CopperLens",
  notLoaded:"未载入文件",
  btnOpen:"打开文件", btnOpenTip:"选一块板子：老式设计库或单板文件，同一个对话框",
  btnFit:"适合窗口", btnFitTip:"快捷键 F：缩放到能看到整块板",
  btnInvert:"反色",
  btnDes:"位号", btnDesTip:"显示元件位号（U3 / R12）",
  btnLabels:"焊盘号", btnLabelsTip:"显示焊盘编号（1、2、3…）",
  btnPour:"覆铜", btnPourTip:"快捷键 H：关掉可以看清覆铜下面的走线",
  asideLayers:"图层", asideView:"视图",
  optDim:"高亮时其余变暗", optPen:"按真实线宽", optVal:"显示型号 / 值",
  stCoord:"坐标", stLayer:"层", stWidth:"线宽", stZoom:"缩放",
  ttl:"PCB 看板 CopperLens — 只读查线",
  author:"© 永远的兰兰",
  navCenter:"回到板子中心", navUp:"上移", navDown:"下移",
  navLeft:"左移", navRight:"右移",

  /* 图层名 */
  layTop:"顶层 Top", layBottom:"底层 Bottom", layVia:"过孔 Via（贯穿）",
  layTopSilk:"顶层丝印 TopOverlay", layBotSilk:"底层丝印 BottomOverlay",
  layKeep:"禁布 KeepOut", layPlane:n=>"内电层"+n, layMech:n=>"机械层"+n,
  /* 分段读取告警前缀 */
  wBoard:"板参数", wNets:"网络", wComps:"元件", wTracks:"走线", wPads:"焊盘",
  wVias:"过孔", wArcs:"圆弧", wFills:"填充", wPolys:"覆铜", wTexts:"文字",
  /* 解析失败 */
  errNoSec:ddb=>"文件里没有找到 PCB 数据段，可能不是 PCB 4.0 格式"+
    (ddb?"，或这个设计库里只有原理图/元件库而没有 PCB。":"。"),
  errNoCuData:"找到了 PCB 数据段，但里面没有走线/焊盘数据。这个文件可能是空的，或只含原理图。",
  errBadFmt:"文件里没有可读的 PCB 数据段，可能不是 PCB 4.0 Binary 格式。",
  errPaged:n=>"这个设计库里的 PCB 是跨页存储的，直接读会错位"+
    "（走线散落在 "+n+" 个层上，正常板子只有几个）。\n请先把它导出成 .pcb 再拖进来查看。",
  noNet:"(未分配网络)",
  padNo:n=>"焊盘 "+n,
  feetTitle:"这次点亮的全部元件脚",
  /* v1.9 新增：图层快捷键 / 找东西 / 通不通 / 存图 */
  lyAll:"全选", lyNone:"全不选", lyCu:"顶底铜", lyInv:"反选",
  lyAllTip:"打开所有图层", lyNoneTip:"关掉所有图层（再逐层点开，一层层叠加看）",
  lyCuTip:"铜层只留顶层和底层（丝印、过孔不动，位号照样看得见）",
  lyInvTip:"已显示的全关掉，已关掉的全打开",
  findPh:"找位号 / 型号 / 网络",
  findNone:"没找到。位号要连着字母输，比如 U100、R12",
  findGrpComp:"元件", findGrpNet:"网络",
  findTagComp:"元件", findTagNet:"网络",
  findNoPad:k=>"「"+k+"」定位到了，但这块元件没有焊盘数据，点不亮",

  ddbWeb:"浏览器里读不了老式设计库（.ddb）—— 解它需要本地组件。请把 .ddb 文件拖到桌面版程序的图标上，或从桌面版里重新打开。",
  readFail:"读不了这个文件，请确认它没被别的程序占用。",
  helpHtml:`
    <h3>打开文件</h3>
    <p>点左上角 <code>打开文件</code>，"设计库（.ddb）"和"单板文件（.pcb）"在同一个对话框里，
       直接挑就行。也可以把文件拖到窗口里。</p>
    <p>一个 .ddb 里常常有好几块板。打开后顶部会出现下拉框，按修改时间从新到旧排，
       最新那块标★，选一个就切过去。</p>

    <h3>查线</h3>
    <ul>
      <li>点一下走线或焊盘 → 与它相连的整条铜亮成黄色，其余变暗。</li>
      <li>状态栏会写出具体脚位，例如 <b>GND&nbsp;&nbsp;U100-4 / C102-1 / C103-1 +7</b>，
          意思是这条线从 U100 的 4 脚出发，一共连到 12 只脚。点中的那只脚总排在最前面。</li>
      <li>鼠标停在焊盘上不动，光标旁会浮出 <b>U100-3</b> 和器件型号。</li>
      <li>点大面积接地/电源平面时，只点亮接在它上面的元件脚，铜皮本身保持原样只描轮廓。</li>
      <li>按 <kbd>Esc</kbd> 或点空白处取消高亮。</li>
    </ul>

    <h3>通不通：查断线最快的办法</h3>
    <p>点顶栏 <code>通不通</code>（或按 <kbd>K</kbd>），在板上点两个位置，画面上方直接给结论：</p>
    <ul>
      <li><b>● 通</b>　U100-4 ↔ C102-2 · 网络 GND · 按网表判定</li>
      <li><b>✕ 不通</b>　U100-4 ↔ R12-1 · 网络不同（GND / VCC）</li>
    </ul>
    <p>判定先看文件里自带的网表（最准）；<b>没有网表的老板子按铜皮实际接触来追</b>——
       线挨着线、穿过过孔到另一层都算连通，所以网络号为 0 的板一样能用。
       通了点亮整条线，不通只点亮这两点，断在哪一眼就看出来。</p>

    <h3>找一个元件 / 一个网络</h3>
    <p>顶栏右边的搜索框（或 <kbd>Ctrl</kbd>+<kbd>F</kbd>）：输 <code>U100</code> 找位号、
       输 <code>AMS1117</code> 找型号、输 <code>GND</code> 找网络。选中即定位并点亮。</p>

    <h3>看图</h3>
    <ul>
      <li>滚轮缩放，<b>以鼠标指着的位置为中心</b>；按住左键拖拽平移。</li>
      <li>右下角有方向按钮 <b>▲▼◀▶</b>，中间 <b>◎</b> 回到板子中心；键盘方向键也能平移。</li>
      <li><kbd>F</kbd> 适合窗口；<kbd>H</kbd> 一键隐藏所有大面积铺铜（看细走线时最好用）。</li>
      <li>左侧点层名 = 开关该层；双击层名 = 只看这一层。</li>
      <li>图层上方的四个快捷键：<b>全选 / 全不选 / 顶底铜 / 反选</b>。
          「顶底铜」把铜层收成顶层+底层，丝印和过孔留着——维修最常用的组合；
          「全不选」之后可以一层层点开叠加。</li>
    </ul>

    <h3>存图</h3>
    <p>顶栏 <code>存图</code> 把当前画面存成 PNG（含位号、型号、高亮），
       文件名带板名和时间，可以直接贴进维修单或发工作群。</p>

    <h3>标注</h3>
    <ul>
      <li><b>位号</b>、<b>焊盘号</b> 默认开，顶栏可关。</li>
      <li>器件型号在左侧"视图 → 显示型号 / 值"。</li>
      <li>标注字会互相避让：缩小时只留位号，放大后焊盘号才一个个出现。</li>
    </ul>

    <h3>快捷键</h3>
    <p><kbd>F</kbd> 适合窗口　<kbd>H</kbd> 覆铜开/关　<kbd>K</kbd> 通不通　
       <kbd>Ctrl</kbd>+<kbd>F</kbd> 找元件/网络　<kbd>Esc</kbd> 取消高亮　
       <kbd>方向键</kbd> 平移　<kbd>+</kbd> <kbd>-</kbd> 缩放</p>`,
  discHtml:`
    <h3>本软件不提供任何担保</h3>
    <p>本程序按"现状"提供，不作任何明示或暗示的保证，包括但不限于对适销性、
       特定用途适用性、以及不侵权的保证。</p>

    <h3>只读工具，不改你的文件</h3>
    <p>本程序只读取文件，<b>绝不修改、覆盖、删除任何原始文件</b>。但仍建议你在
       操作前自行备份重要资料。因误操作、文件损坏、存储介质故障等造成的任何损失，
       作者不承担责任。</p>

    <h3>显示结果仅供参考</h3>
    <p>本程序根据二进制文件内容推算图形与电气连接关系，<b>可能与原厂软件显示不一致</b>，
       也可能存在解析错误。请勿将其作为设计、生产、检验的唯一依据。
       <b>涉及安全、医疗、交通、电力等关键场合，务必以原厂软件和原始设计文件为准。</b></p>

    <h3>维修作业风险自负</h3>
    <p>依据本程序显示的信息进行焊接、拆装、通电测试等操作，风险由操作者自行承担。
       作者不对由此产生的设备损坏、人身伤害或经济损失负责。</p>

    <h3>与任何厂商无关</h3>
    <p>本程序为独立开发的第三方工具，与任何 EDA 软件厂商<b>没有隶属、授权、合作或背书关系</b>，
       也未使用其任何代码、图标或资源。文中出现的文件格式名称仅用于说明兼容性，
       相关商标归各自所有者。</p>

    <h3>开源组件</h3>
    <p>读取 .ddb 设计库时调用了 mdbtools（GPL-2.0）中的命令行程式，其许可证随程序一同提供。</p>
    <div class="sig">使用本程序即表示你已阅读并接受上述条款。</div>`,
  aboutHtml:`
    <h3>PCB 看板 / CopperLens</h3>
    <p>一个<b>只看不改</b>的线路板查线工具。为产线维修、售后排查这类
       "只想看看这块板子上的线通到哪儿"的场合而做。</p>
    <p>免安装的单文件程序，不联网、不写注册表、不装任何运行库。
       从 Windows 7 到 Windows 11，32 位和 64 位系统都能直接跑。</p>
    <p class="dim">已在 Windows 10（32 位）和 Windows 11（64 位）上实测通过。</p>
    <h3>能做什么</h3>
    <ul>
      <li>打开 .pcb 单板文件，或 .ddb 设计库（自动列出里面所有板）</li>
      <li>点一下走线/焊盘，亮出整条铜箔，并写出 U100-4 这样的具体脚位</li>
      <li>显示元件位号、型号、焊盘编号；大面积铺铜可一键隐藏</li>
      <li><b>两点通不通</b>：点两个位置，直接判定电气上通不通（没网表的老板子也行）</li>
      <li><b>找元件 / 找网络</b>：输 U100、型号或网络名，跳过去并点亮</li>
      <li>图层一键全选 / 全不选 / 只看顶底铜；当前画面一键存 PNG</li>
    </ul>
    <h3>版本</h3>
    <p>v1.9　·　x86 程序，64 位系统同样可用　·　单文件便携版</p>
    <div class="sig">© 永远的兰兰　·　Lanlan Eternal</div>`

  helpHtml:`
    <h3>Opening a file</h3>
    <p>Click <code>Open File</code>. Design libraries (.ddb) and single boards (.pcb)

    <h3>Tracing a net</h3>
    <ul>
      <li>Click a trace or pad — every piece of copper on that net turns yellow, the rest dims.</li>

    <h3>Continuity: the fastest way to find a broken trace</h3>

       The verdict appears at the top of the canvas:</p>

    </ul>
    <p>The netlist stored in the file is used first (most reliable). <b>Boards without a netlist
       fall back to real copper contact</b> — traces touching traces, vias crossing layers all

    <h3>Find a part or a net</h3>
    <p>Search box on the right of the toolbar (or <kbd>Ctrl</kbd>+<kbd>F</kbd>):

let lang = "zh";
function T(k){

}
/* 窗口标题：程序名（随语言变） + 当前板子名（exe 注入到 __TITLE__）。
   Edge 用 --app 打开时，窗口标题栏取的就是 document.title。 */
function applyTitle(){
