  document.title = T("ttl") + (base ? " — " + base : "");
}
/* 网页版判断：既没有内嵌的 __BOARDS__、也没有 __EMBED_DATA__，就是被当成普通网页打开。
   这种模式下没有本地 mdbtools，所以读不了设计库（.ddb），文案要区别对待。 */
function isWebMode(){
  return !(window.__BOARDS__ && window.__BOARDS__.length)
      && !(typeof window.__EMBED_DATA__ === "string" && window.__EMBED_DATA__);
}
function applyLang(){
  document.documentElement.lang = (lang==="zh" ? "zh-CN" : "en");
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = T(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{
    el.title = T(el.dataset.i18nTitle);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    el.placeholder = T(el.dataset.i18nPh);
  });
  document.getElementById("langTxt").textContent = (lang==="zh" ? "EN" : "中文");
  document.getElementById("hint").innerHTML = T(isWebMode() ? "hintWeb" : "hintHtml");
  document.getElementById("bd-help").innerHTML = T("helpHtml");
  document.getElementById("bd-disc").innerHTML = T("discHtml");
  document.getElementById("bd-about").innerHTML = T("aboutHtml");
  applyTitle();
  if(B){ refreshFileLine(); buildLayers(); }
}
/* 顶栏那行"文件名 · N 个对象" + 状态栏统计。单独抽出来，切语言时要跟着变。 */
let lastName = "", lastMs = 0;
function refreshFileLine(){
  if(!B) return;
  const n=B.tracks.length+B.pads.length+B.vias.length+B.fills.length;
  document.getElementById("fname").textContent =
    T("fnameLine", lastName, B.fromDdb, n, B.polys.length);
  document.getElementById("stStats").textContent = T("stats", {
    t:B.tracks.length, p:B.pads.length, v:B.vias.length,
    f:B.fills.length, po:B.polys.length, n:B.nets.length,
    d:B.desCount||0, val:B.valCount||0, ms:lastMs
  });
}

/* ============================================================
   `PCB 4.0 Binary File` 格式只读解析 + 查线

   段布局：0 处是带 1 字节长度前缀的段名；+256 处
   uint16 元素大小 / uint32 元素数 / uint32 下一段偏移；数据从 +266 起。

   字段偏移由本人对样本文件做二进制差分实测得出，并与多个真实设计文件
   逐字段核对过。两个关键点（画错/查错都是这里出的）：
     · 焊盘 (xs,ys) 是「未旋转」的尺寸，必须按 +79 处的 float6 旋转角
       摆正。90°/270° 时等于 x/y 互换。不转的话 50mil 间距的长方形焊盘
       会前后叠在一起，看上去"粘成一片"。
     · 连接性只在铜层之间算。多层焊盘(74)/过孔会贯穿所有铜层，
       但绝不能去连丝印(33/34)、禁布(56)、机械层 —— 丝印线常常压着焊盘过，
       一算就会把一整颗芯片的脚全连上。
   ============================================================ */
const MAGIC4 = "PCB 4.0 Binary File";
const MAGIC3 = "PCB 3.0 Binary File";

/* 该格式的层号表（LAYERnNAME 里读到的就是这套） */
const LAYER_NAMES = {
  1:"TopLayer", 32:"BottomLayer", 33:"TopOverlay", 34:"BottomOverlay",
  35:"TopPaste", 36:"BottomPaste", 37:"TopSolder", 38:"BottomSolder",
  55:"DrillGuide", 56:"KeepOutLayer", 73:"DrillDrawing", 74:"MultiLayer",
  75:"ConnectLayer", 76:"BackGroundLayer", 77:"DRCErrorLayer", 78:"HighlightLayer"
};
function stdLayerName(n){
  if(LAYER_NAMES[n]) return LAYER_NAMES[n];
  if(n>=2 && n<=31) return "MidLayer"+(n-1);
  if(n>=39 && n<=54) return "InternalPlane"+(n-38);
  if(n>=57 && n<=72) return "Mechanical"+(n-56);
  return "Layer"+n;
}
/* 铜层：1~32 信号层 + 39~54 内电层。其它一律不算电气连通。 */
function isCuLayer(n){ return (n>=1 && n<=32) || (n>=39 && n<=54); }

/* 整块字节转 latin1 字符串，用原生 indexOf 找段名。
   DDB 动辄几 MB，逐字节比较会慢到卡死界面。 */
function toLatin1(u8){
  try{ return new TextDecoder("latin1").decode(u8); }catch(_){}
  let s="";
  const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH)
    s+=String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return s;
}

function makeReader(buf){
  const dv = new DataView(buf);
  const u8  = new Uint8Array(buf);
  let _latin=null;
  const ret = {
    dv, u8, len: buf.byteLength,
    u16:o=>dv.getUint16(o,true),
    i16:o=>dv.getInt16(o,true),
    i32:o=>dv.getInt32(o,true),
    u32:o=>dv.getUint32(o,true),
    float6(b,o){                   // MBF 48-bit
      if(b[o]===0) return 0;
      let f=((b[o+1]|(b[o+2]<<8)|(b[o+3]<<16)|(b[o+4]<<24))>>>0)/4294967296;
      f=(f+(b[o+5]&0x7f))/128+1;
      f*=Math.pow(2,b[o]-129);
      return (b[o+5]&0x80)?-f:f;
    }
  };
  Object.defineProperty(ret,"latin",{get(){ if(_latin===null) _latin=toLatin1(u8); return _latin; }});
  return ret;
}
function latin1(u8,o,n){
  let s="",i=o,e=Math.min(o+n,u8.length);
  for(;i<e;i++) s+=String.fromCharCode(u8[i]);
  return s;
}

/* 板子里存的文字（图层名、网络名、元件库/型号、板上的标注串）在
   1998-2000 年前后那代设计文件里多是 GBK 单字节，直接按 latin1 转出来
   就是 "µ¥Ãæ" 这种乱码。只有出现 0x80 以上的字节才去做识别，纯 ASCII
   走原路，不给大板子添额外开销。 */
let _TD_UTF8F=null, _TD_GBK=null;
function decBytes(b){
  const n=b.length;
  let hi=false;
  for(let i=0;i<n;i++) if(b[i]>127){ hi=true; break; }
  if(!hi){
    let s="";
    for(let i=0;i<n;i++) s+=String.fromCharCode(b[i]);
    return s;
  }
  const u8=(b instanceof Uint8Array)?b:Uint8Array.from(b);
  try{
    if(!_TD_UTF8F) _TD_UTF8F=new TextDecoder("utf-8",{fatal:true});
    return _TD_UTF8F.decode(u8);            // 本身是 UTF-8 的库
  }catch(_){}
  try{
    if(!_TD_GBK) _TD_GBK=new TextDecoder("gbk");
    const t=_TD_GBK.decode(u8);
    if(t.indexOf("\uFFFD")<0) return t;      // GBK 解得通，且没有坏字节
  }catch(_){}
  return latin1(u8,0,n);
}
function txt8(u8,o,n){ return decBytes(u8.subarray(o,Math.min(o+n,u8.length))); }

/* string8：1 字节长度 + 内容。有的记录里是定长字段（首字节不是长度），
   这时退化成"读到 0 或不可打印字符为止"。 */
function str8(u8,at,maxLen,allowHigh){
  if(at<0||at>=u8.length) return "";
  const n=u8[at];
  const b=[];
  if(n>0 && n<=32){
    for(let i=0;i<n && at+1+i<u8.length;i++){
      const c=u8[at+1+i];
      if(c===0) break;
      if(!allowHigh && (c<32||c>126)) break;
      b.push(c);
    }
    return decBytes(b).replace(/"/g,"");
  }
  const lim=maxLen||24;
  for(let i=0;i<lim && at+i<u8.length;i++){
    const c=u8[at+i];
    if(c===0) break;
    if(!allowHigh && (c<32||c>126)) break;
    b.push(c);
  }
  return decBytes(b).replace(/"/g,"");
}

/* 该格式段名的全部候选。定位时不靠 nxt 链，而是按名字逐个扫，
   这样即使文件中间某段的链接字段损坏（真实文件里确实会发生），
   后面的走线、焊盘也不会整段丢掉。 */
const SECNAMES = ["PCB 4.0 Binary File","PCB 3.0 Binary File","ECO Options",
  "Output Options","Printer Options","Gerber Options","Advanced Placer Options",
  "Design Rule Checker Options","Classes","Nets","Components","Polygons","Dimensions",
  "Rules","Embeddeds","Arcs","Pads","Vias","Tracks","Texts","Fills"];
const MAGICS = ["PCB 4.0 Binary File","PCB 3.0 Binary File"];

function scanSections(r){
  const u8 = r.u8, latin = r.latin, found = [];
  for(const nm of SECNAMES){
    const nb = nm.length;
    let from = 0;
    for(;;){
      const p = latin.indexOf(nm, from);
      if(p < 0) break;
      from = p + 1;
      if(p < 1) continue;
      const L = u8[p-1];
      // 段名区 = [1 字节长度][名字][补零]。真实文件里个别段的名字被
      // CR/LF 包住（"\r\nComponents\r"），此时长度会比名字长 1~3。
      if(L === nb || (L > nb && L - nb <= 3)) found.push({s:p-1, name:nm});
    }
  }
  found.sort((a,b)=>a.s-b.s);
  const out=[], seen=new Set();
  for(const f of found){
    const k = f.s+"|"+f.name;
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(f);
  }
  return out;
}

/* 段头：S+256（个别段 S+257）。用 element size / 数量 / 数据区是否
   落在文件内来打分，选最自洽的那个。 */
function segHeader(r, s){
  let best = null;
  for(const d of [256, 257]){
    const h = s + d;
    if(h + 10 > r.len) continue;
    const esz = r.u16(h), num = r.u32(h+2), nxt = r.u32(h+6);
    const body = h + 10;
    let sc = 0;
    if(esz >= 1 && esz <= 2000) sc += 4;
    if(num >= 0 && num <= 300000) sc += 4;
    if(esz >= 1 && num >= 0 && body + esz*num <= r.len) sc += 6;   // 数据区完整
    else sc -= 6;
    if(nxt === 0 || nxt < r.len) sc += 1;
    if(!best || sc > best.sc) best = {sc, esz, num, nxt, hdr:h, body};
  }
  return best;
}

function parseBoard(arrayBuffer){
  const r = makeReader(arrayBuffer);
  const b = {
    layers:{}, copper:[], nets:[], tracks:[], pads:[], vias:[], arcs:[],
    fills:[], texts:[], comps:[], polys:[], sections:[], warn:[]
  };
  b.fromDdb = isJet(r.u8);

  let secs = [];
  for(const f of scanSections(r)){
    const hd = segHeader(r, f.s);
    if(!hd) continue;
    if(hd.sc < 4) continue;                 // 数据区不完整或字段离谱，判为误匹配
    secs.push({name:f.name, s:f.s, ...hd});
  }
  if(!secs.length)
    throw new Error(T("errNoSec", b.fromDdb));

  // 按 "PCB 4.0 Binary File" 分组：一个 DDB 里可能有多块板
  const boards = [];
  let cur = null;
  for(const sec of secs){
    if(MAGICS.includes(sec.name)){
      cur = {name:sec.name, start:sec.s, secs:[]};
      boards.push(cur);
    }
    if(cur) cur.secs.push(sec);
    else { cur = {name:"(unknown)", start:0, secs:[sec]}; boards.push(cur); }
  }
  const scored = boards.map(bd=>{
    const names = new Set(bd.secs.map(x=>x.name));
    const trk = bd.secs.find(x=>x.name==="Tracks");
    return {bd, size: trk ? trk.num : 0,
      score:(names.has("Tracks")?3:0)+(names.has("Pads")?2:0)+(names.has("Vias")?1:0)};
  }).filter(x=>x.score>0)
    .sort((a,c)=> (c.score-a.score) || (c.size-a.size));
  if(!scored.length)
    throw new Error(T("errNoCuData"));
  const board = scored[0].bd;
  b.boardCount = scored.length;
  b.sections = board.secs.map(x=>({name:x.name, count:x.num, at:x.s}));

  const used = new Set();
  const pick = nm => {
    for(const sec of board.secs){
      if(sec.name !== nm) continue;
      const k = nm+"@"+sec.s;
      if(used.has(k)) continue;
      if(sec.body + sec.esz*sec.num > r.len) continue;
      used.add(k);
      return sec;
    }
    return null;
  };

  const bs = pick("PCB 4.0 Binary File") || pick("PCB 3.0 Binary File");
  if(bs){
    try{ readBoardSection(b, r, bs.body, bs.num); }
    catch(e){ b.warn.push(T("wBoard")+": " + e.message); }
  }
  let f;
  try{ if((f=pick("Nets")))       readNets(b,r,f.body,f.num); }          catch(e){ b.warn.push(T("wNets")+": "+e.message); }
  try{ if((f=pick("Components"))) readComps(b,r,f.body,f.num,f.esz); }   catch(e){ b.warn.push(T("wComps")+": "+e.message); }
  try{ if((f=pick("Tracks")))     readTracks(b,r,f.body,f.num,f.esz); }  catch(e){ b.warn.push(T("wTracks")+": "+e.message); }
  try{ if((f=pick("Pads")))       readPads(b,r,f.body,f.num,f.esz); }    catch(e){ b.warn.push(T("wPads")+": "+e.message); }
  try{ if((f=pick("Vias")))       readVias(b,r,f.body,f.num,f.esz); }    catch(e){ b.warn.push(T("wVias")+": "+e.message); }
  try{ if((f=pick("Arcs")))       readArcs(b,r,f.body,f.num,f.esz); }    catch(e){ b.warn.push(T("wArcs")+": "+e.message); }
  try{ if((f=pick("Fills")))      readFills(b,r,f.body,f.num,f.esz); }   catch(e){ b.warn.push(T("wFills")+": "+e.message); }
  try{ if((f=pick("Polygons")))   readPolys(b,r,f.body,f.num,f.esz); }   catch(e){ b.warn.push(T("wPolys")+": "+e.message); }
  try{ if((f=pick("Texts")))      readTexts(b,r,f.body,f.num,f.esz); }   catch(e){ b.warn.push(T("wTexts")+": "+e.message); }

  if(!b.layers[1] && !b.tracks.length && !b.pads.length)
    throw new Error(T("errBadFmt"));

  finish(b);

  // DDB 里的大段数据是跨 2KB 页存的，页头会插进记录流。段小的还能读，
  // 段一大就整段错位，画出来全是乱七八糟的圆和层。宁可明说不能看，
  // 也不能给一张假图 —— 维修照着假图查线是会出事的。
  if(b.fromDdb){
    const bad = badRate(b);
    const lySet = new Set(b.tracks.map(t=>t.layer));
    if(bad > 0.08 || lySet.size > 16)
      throw new Error(T("errPaged", lySet.size));
  }
  return b;
}

/* 记录可信度：层号越界或坐标离谱的比例 */
function badRate(b){
  const all=[...b.tracks,...b.pads,...b.vias];
  if(!all.length) return 0;
  let bad=0;
  for(const o of all){
    let ok=true;
    const ly=o.layer;
    if(ly!==undefined && !(ly<=100 || (ly>=169&&ly<=176))) ok=false;
    for(const k of ["x","y","x1","y1","x2","y2"]){
      const v=o[k];
      if(v!==undefined && Math.abs(v)>100000) ok=false;
    }
    if(!ok) bad++;
  }
  return bad/all.length;
}

function isJet(u8){
  return u8.length>24 && u8[0]===0 && u8[1]===1 && u8[2]===0 && u8[3]===0 &&
    String.fromCharCode(u8[4],u8[5],u8[6],u8[7],u8[8],u8[9],u8[10],u8[11])==="Standard";
}

function readBoardSection(b,r,off,num){
  const d={};
  // [2 字节记录标记][u16 长度][字符串]
  for(let i=0;i<num;i++){
    if(off+4>r.len) break;
    const n=r.u16(off+2);
    if(!n || off+4+n>r.len) break;
    const s=txt8(r.u8,off+4,n);
    off += 4 + n;
    for(const f of s.split("|")){
      const p=f.indexOf("=");
      if(p>0) d[f.slice(0,p).trim()]=f.slice(p+1).trim();
    }
  }
  for(const k in d){
    const m=/^LAYER(\d+)NAME$/.exec(k);
    if(m) b.layers[+m[1]]=d[k];
  }
  let cur=1,g=0;
  while(cur && g++<64){
    if(!b.layers[cur]) break;
    b.copper.push(cur);
    cur=parseInt(d["LAYER"+cur+"NEXT"]||"0",10)||0;
  }
  b.originX=num0(d.ORIGINX); b.originY=num0(d.ORIGINY);
}
function num0(v){
  if(v==null) return 0;
  const s=String(v).replace(/[^0-9.\-]/g,"");
  const f=parseFloat(s);
  return isFinite(f)?f:0;
}

function readNets(b,r,off,num){
  for(let i=0;i<num;i++){
    if(off+4>r.len) break;
    const n=r.u16(off+2);
    if(!n || off+4+n>r.len) break;
    const s=txt8(r.u8,off+4,n);
    off += 4 + n;
    let name="";
    for(const f of s.split("|")){
      if(f.startsWith("NAME=")){ name=f.slice(5); break; }
    }
    b.nets.push(name);
  }
}

function readComps(b,r,off,num,esz){
  for(let i=0;i<num;i++){
    const at=off+i*esz;
    if(at+320>r.len) break;
    b.comps.push({
      id:r.i16(at+4),
      layer:r.u8[at+2],
      x:r.i32(at+39)/1e4, y:r.i32(at+43)/1e4,
      rot:r.float6(r.u8,at+309),
      lib:str8(r.u8,at+47,50,true)
    });
  }
}

/* DDB 里大段数据是跨 2KB 页存的，页头会插进记录流，导致后面全部错位。
   读的时候一旦发现当前记录不像样，就向后滑几字节重新对齐。 */
function looksTrack(r,at){
  const ly=r.u8[at+2];
  if(!(ly<=100 || (ly>=169&&ly<=176))) return false;
  const x1=r.i32(at+19), y1=r.i32(at+23);   // 单位 1/10000 mil
  if(Math.abs(x1)>2e9 || Math.abs(y1)>2e9) return false;
  const w=r.i32(at+35);
  return w>=0 && w<1e7;
}
function realign(r,p,esz,maxSlide){
  let k=0;
  while(k<maxSlide && p+esz<=r.len && !looksTrack(r,p)){ p++; k++; }
  return p;
}

function readTracks(b,r,off,num,esz){
  let p=off;
  for(let i=0;i<num;i++){
    p=realign(r,p,41,96);
    const at=p;
    if(at+41>r.len) break;
    p+=esz;
    b.tracks.push({
      kind:"track",
      layer:r.u8[at+2], net:r.i16(at+4), comp:r.i16(at+13),
      poly:r.i16(at+11),
      x1:r.i32(at+19)/1e4, y1:r.i32(at+23)/1e4,
      x2:r.i32(at+27)/1e4, y2:r.i32(at+31)/1e4,
      w:r.i32(at+35)/1e4
    });
  }
}

function readPads(b,r,off,num,esz){
  for(let i=0;i<num;i++){
    const at=off+i*esz;
    if(at+126>r.len) break;
    const xt=r.i32(at+27)/1e4, yt=r.i32(at+31)/1e4;
    const xm=r.i32(at+35)/1e4, ym=r.i32(at+39)/1e4;
    const xb=r.i32(at+43)/1e4, yb=r.i32(at+47)/1e4;
    let xs=xt, ys=yt;
    // 个别焊盘某一维是 0（只有孔径、没有铜环的记录），用另一维顶上
    if(!(xs>0.05) && ys>0.05) xs=ys;
    if(!(ys>0.05) && xs>0.05) ys=xs;
    b.pads.push({
      kind:"pad",
      layer:r.u8[at+2], net:r.i16(at+4), comp:r.i16(at+13),
      x:r.i32(at+19)/1e4, y:r.i32(at+23)/1e4,
      xs, ys,
      stack:(xt!==xm)||(xt!==xb)||(yt!==ym)||(yt!==yb),
      xm, ym, xb, yb,
      hole:r.i32(at+51)/1e4,
      shape:r.u8[at+55],
      name:str8(r.u8,at+58,20,false),
      rot:r.float6(r.u8,at+79),
      plated:r.u8[at+85]!==0
    });
  }
}

function readVias(b,r,off,num,esz){
  for(let i=0;i<num;i++){
    const at=off+i*esz;
    if(at+37>r.len) break;
    b.vias.push({
      kind:"via", layer:74, net:r.i16(at+4),
      x:r.i32(at+19)/1e4, y:r.i32(at+23)/1e4,
      dia:r.u32(at+27)/1e4, hole:r.u32(at+31)/1e4,
      start:r.u8[at+35], end:r.u8[at+36]
    });
  }
}

function readArcs(b,r,off,num,esz){
  for(let i=0;i<num;i++){
    const at=off+i*esz;
    if(at+47>r.len) break;
    b.arcs.push({
      kind:"arc",
      layer:r.u8[at+2], net:r.i16(at+4), comp:r.i16(at+13),
      poly:r.i16(at+11),
      x:r.i32(at+19)/1e4, y:r.i32(at+23)/1e4,
      radius:r.i32(at+27)/1e4,
      a1:r.float6(r.u8,at+31), a2:r.float6(r.u8,at+37),
      w:r.i32(at+43)/1e4
    });
  }
}

/* 填充块（矩形铜）。老设计里电源走线常用它顶替粗线。 */
function readFills(b,r,off,num,esz){
  for(let i=0;i<num;i++){
    const at=off+i*esz;
    if(at+41>r.len) break;
    b.fills.push({
      kind:"fill",
      layer:r.u8[at+2], net:r.i16(at+4), comp:r.i16(at+13), poly:r.i16(at+11),
      x1:r.i32(at+19)/1e4, y1:r.i32(at+23)/1e4,
      x2:r.i32(at+27)/1e4, y2:r.i32(at+31)/1e4,
      rot:r.float6(r.u8,at+35)
    });
  }
}

/* 覆铜（Polygon / 大面积铺铜）。
   这块以前完全没解析 —— 而实测的生产板里 7465 条走线中 6750 条是
   **覆铜填充生成的填充线**（只有 715 条是真走线），它们各自带一个
   polygon 编号（track 记录 +11）。所以"底层大面积接地只亮一条线"
   的根因是：点中覆铜时命中的是一条填充线，而它属于一块几千条线的
   覆铜，旧逻辑一见超过 900 处就只标当前那一条。

   记录是**变长**的：45 字节定长头 + (N+1)×33 字节顶点，段里的
   element size 写的是 45（只算定长部分），不能按 esz 步进。
   顶点 0=直线点，>0=圆弧点（带圆心/起止角/半径）。 */
function readPolys(b,r,off,num,esz){
  let p=off;
  for(let i=0;i<num;i++){
    if(p+45>r.len) break;
    const N=r.u16(p+43);
    if(!(N>=0&&N<20000) || p+45+(N+1)*33>r.len) break;
    const o={
      kind:"polygon", layer:r.u8[p+2], net:r.i16(p+23), pid:r.i16(p+4),
      pts:[], arcs:0, closed:false
    };
    let vp=p+45;
    for(let n=0;n<=N;n++){
      const v=vp+n*33, kd=r.u8[v];
      const vx=r.i32(v+1)/1e4, vy=r.i32(v+5)/1e4;
      if(kd===0 || kd===undefined){
        o.pts.push([vx,vy]);
      }else{
        // 圆弧顶点：用圆心+半径+起止角离散成折线，接在前一点后面
        o.arcs++;
        const cx=r.i32(v+9)/1e4, cy=r.i32(v+13)/1e4;
        const sa=r.float6(r.u8,v+17), ea=r.float6(r.u8,v+23);
        const rr=r.i32(v+29)/1e4;
        if(!(rr>0) || !isFinite(sa) || !isFinite(ea) || rr>1e5){ o.pts.push([vx,vy]); continue; }
        let a1=sa, a2=ea;
        if(a2<a1) a2+=360;
        let span=a2-a1;
        if(!(span>0.01)) span=360;
        if(span>360) span=360;
        const seg=Math.max(2,Math.min(24,Math.ceil(span/15)));
        for(let k=1;k<=seg;k++){
          const t=(a1+span*k/seg)*Math.PI/180;
          o.pts.push([cx+rr*Math.cos(t), cy+rr*Math.sin(t)]);
        }
      }
    }
    p=vp+(N+1)*33;
    // 首尾重合 = 闭合轮廓；不重合的多半是被拆开的多边形，也照样当闭合用
    if(o.pts.length>2){
      o.closed=true;
      b.polys.push(o);
    }
  }
}

/* 文本（丝印字、元件位号、元件型号）
   记录长 302 字节：
     +2 layer  +13 元件号  +19/+23 坐标  +27 字高  +33 旋转
     +40 字符串（1 字节长度 + 内容）
     +296 字宽  +300 =1 是"型号/值"  +301 =1 是"元件位号"
   以前这里把字符串偏移当成 +35、也没读两个标志位，所以丝印上的字全是乱码，
   更没法把"U3"这种位号跟元件对上。 */
function readTexts(b,r,off,num,esz){
  for(let i=0;i<num;i++){
    const at=off+i*esz;
    if(at+302>r.len) break;
    b.texts.push({
      kind:"text",
      layer:r.u8[at+2], comp:r.i16(at+13),
      x:r.i32(at+19)/1e4, y:r.i32(at+23)/1e4,
      h:r.i32(at+27)/1e4,
      rot:r.float6(r.u8,at+33),
      text:str8(r.u8,at+40,80,true),
      isDes:(esz>301) ? r.u8[at+301]>0 : false,
      isCom:(esz>300) ? r.u8[at+300]>0 : false
    });
  }
}

/* ======================= 几何图元 =======================
   每个可导电的图元都归一到两种形状：
     · 带线宽的折线  segs[[x1,y1,x2,y2],...] + w
     · 凸多边形      pts[[x,y],...]
   这样任意两图元的间距只需要 4 个函数（点线、线线、线凸包、凸包凸包）。 */

function rotPt(cx,cy,angDeg,lx,ly){
  const a=angDeg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  return [cx+lx*c-ly*s, cy+lx*s+ly*c];
}

/* 焊盘外形 → 凸多边形。关键是按 rot 摆正：该格式存的 (xs,ys) 是
   焊盘自身坐标，旋转角在 +79。忽略它，50mil 间距的长条焊盘会前后重叠。 */
function padPoly(o){
  const hx=o.xs/2, hy=o.ys/2, rot=o.rot||0, out=[];
  const shape=o.shape;
  if(shape===2 || shape===undefined){          // 方形
    out.push([-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]);
  }else if(shape===3){                          // 八角
    const k=0.4142;
    out.push([-hx,-hy*k],[-hx*k,-hy],[hx*k,-hy],[hx,-hy*k],
             [hx,hy*k],[hx*k,hy],[-hx*k,hy],[-hx,hy*k]);
  }else{                                        // 圆形 / 椭圆
    const N=16;
    for(let i=0;i<N;i++){
      const t=i*2*Math.PI/N;
      out.push([hx*Math.cos(t), hy*Math.sin(t)]);
    }
  }
  return out.map(p=>rotPt(o.x,o.y,rot,p[0],p[1]));
}

function arcSegs(o){
  const out=[];
  let a1=+o.a1, a2=+o.a2;
  if(!isFinite(a1)||!isFinite(a2)) return out;
  if(a2<a1) a2+=360;
  let span=a2-a1;
  if(!(span>0.001)) span=360;
  if(span>360) span=360;
  const n=Math.max(4,Math.min(36,Math.ceil(span/8)));
  const R=o.radius||0;
  let px=o.x+R*Math.cos(a1*Math.PI/180), py=o.y+R*Math.sin(a1*Math.PI/180);
  for(let i=1;i<=n;i++){
    const t=(a1+span*i/n)*Math.PI/180;
    const nx=o.x+R*Math.cos(t), ny=o.y+R*Math.sin(t);
    out.push([px,py,nx,ny]);
    px=nx; py=ny;
  }
  return out;
}

/* 图元占用的铜层：数组，或 "all"（多层焊盘 / 过孔） */
function cuOf(o){
  if(o.kind==="via"){
    const s=o.start||1, e=o.end||32;
    if(s>=74||e>=74||s>e||s===e) return "all";
    return "all";     // 过孔贯穿起止层，老板子基本都是通孔
  }
  if(o.kind==="pad" && o.layer===74) return "all";
  if(isCuLayer(o.layer)) return [o.layer];
  return null;        // 丝印 / 禁布 / 机械层：不参与电气连通
}

function makeGeom(o){
  if(o.kind==="track"){
    o.segs=[[o.x1,o.y1,o.x2,o.y2]];
  }else if(o.kind==="arc"){
    o.segs=arcSegs(o);
    if(!(o.w>0)) o.w=0;
  }else if(o.kind==="pad"){
    o.pts=padPoly(o);
  }else if(o.kind==="via"){
    o.pts=padPoly({x:o.x,y:o.y,xs:o.dia,ys:o.dia,shape:1,rot:0});
  }else if(o.kind==="fill"){
    const cx=(o.x1+o.x2)/2, cy=(o.y1+o.y2)/2;
    const hx=Math.abs(o.x2-o.x1)/2, hy=Math.abs(o.y2-o.y1)/2;
    o.pts=[[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]].map(p=>rotPt(cx,cy,o.rot||0,p[0],p[1]));
  }
  // 包围盒
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  if(o.pts){
    for(const p of o.pts){
      if(p[0]<x1)x1=p[0]; if(p[0]>x2)x2=p[0];
      if(p[1]<y1)y1=p[1]; if(p[1]>y2)y2=p[1];
    }
  }else if(o.segs && o.segs.length){
    const e=(o.w||0)/2;
    for(const s of o.segs){
      x1=Math.min(x1,s[0]-e,s[2]-e); x2=Math.max(x2,s[0]+e,s[2]+e);
      y1=Math.min(y1,s[1]-e,s[3]-e); y2=Math.max(y2,s[1]+e,s[3]+e);
    }
  }
  o.bb=(x2>=x1)?{x1,y1,x2,y2}:null;
}

/* ============ 距离：两图元铜皮之间的最小间距（<0 即重叠） ============ */
function ptSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  if(L<1e-12) return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/L;
  t=t<0?0:t>1?1:t;
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function segSeg(a,b,c,d,e,f,g,h){
  return Math.min(ptSeg(a,b,e,f,g,h), ptSeg(c,d,e,f,g,h),
                  ptSeg(e,f,a,b,c,d), ptSeg(g,h,a,b,c,d));
}
function ptInPoly(px,py,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function segPoly(x1,y1,x2,y2,pts){
  if(ptInPoly(x1,y1,pts) || ptInPoly(x2,y2,pts)) return 0;
  let m=Infinity;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const d=segSeg(x1,y1,x2,y2,pts[j][0],pts[j][1],pts[i][0],pts[i][1]);
    if(d<m) m=d;
    if(m<=0) return 0;
  }
  return m;
}
function polyPoly(A,B){
  for(const p of A) if(ptInPoly(p[0],p[1],B)) return 0;
  for(const p of B) if(ptInPoly(p[0],p[1],A)) return 0;
  let m=Infinity;
  for(let i=0;i<A.length;i++){
    const a=A[i], c=A[(i+1)%A.length];
    for(let j=0;j<B.length;j++){
      const d=segSeg(a[0],a[1],c[0],c[1], B[j][0],B[j][1], B[(j+1)%B.length][0],B[(j+1)%B.length][1]);
      if(d<m) m=d;
      if(m<=0) return 0;
    }
  }
  return m;
}
function segsPoly(segs,pts){
  let m=Infinity;
  for(const s of segs){
    const d=segPoly(s[0],s[1],s[2],s[3],pts);
    if(d<m) m=d;
    if(m<=0) return 0;
  }
  return m;
}
function segsSegs(A,B){
  let m=Infinity;
  for(const a of A){
    for(const b of B){
      const d=segSeg(a[0],a[1],a[2],a[3],b[0],b[1],b[2],b[3]);
      if(d<m) m=d;
      if(m<=0) return 0;
    }
  }
  return m;
}
function entDist(a,b){
  const wa=a.segs?((a.w||0)/2):0;
  const wb=b.segs?((b.w||0)/2):0;
  if(a.pts && b.pts) return polyPoly(a.pts,b.pts);
  if(a.segs && b.pts) return segsPoly(a.segs,b.pts)-wa;
  if(a.pts && b.segs) return segsPoly(b.segs,a.pts)-wb;
  return segsSegs(a.segs,b.segs)-wa-wb;
}

/* 只认真正接触。留正容差会让相邻铜箔连成一片，
   0.06mil 仅用于吃掉 1/10000mil 整数换算的舍入误差。 */
const EPS = 0.06;

function shareCu(a,b){
  if(!a.cu || !b.cu) return false;
  if(a.cu==="all" || b.cu==="all") return true;
  for(const l of a.cu) if(b.cu.indexOf(l)>=0) return true;
  return false;
}

/* ======================= 收尾：索引 + 网络 ======================= */
function finish(b){
  const LIM=2e5;   // mil（=200 英寸），超过必然是跨页损坏的记录
  const sane=o=>{
    if(o.kind==="polygon"){
      if(!o.pts || o.pts.length<3 || o.pts.length>40000) return false;
      for(const p of o.pts)
        if(!isFinite(p[0])||!isFinite(p[1])||Math.abs(p[0])>LIM||Math.abs(p[1])>LIM) return false;
      return true;
    }
    for(const k of ["x1","y1","x2","y2","x","y"]){
      const v=o[k];
      if(v!==undefined && (!isFinite(v)||Math.abs(v)>LIM)) return false;
    }
    return true;
  };
  let dropped=0;
  for(const key of ["tracks","pads","vias","arcs","fills","polys"]){
    const before=b[key].length;
    b[key]=b[key].filter(sane);
    dropped+=before-b[key].length;
  }
  if(dropped) b.warn.push(T("wDropped", dropped));

  b.all=[...b.tracks,...b.pads,...b.vias,...b.arcs,...b.fills];
  b.all.forEach((o,i)=>{ o._i=i; });   // 反查下标用，避免每次 indexOf 扫全表

  // 几何 + 铜层归属（覆铜面也要算，否则没有 bb 就无法命中/渲染）
  const bb={x1:Infinity,y1:Infinity,x2:-Infinity,y2:-Infinity};
  for(const o of b.all.concat(b.polys)){
    makeGeom(o);
    o.cu=cuOf(o);
    if(o.bb){
      if(o.bb.x1<bb.x1)bb.x1=o.bb.x1; if(o.bb.y1<bb.y1)bb.y1=o.bb.y1;
      if(o.bb.x2>bb.x2)bb.x2=o.bb.x2; if(o.bb.y2>bb.y2)bb.y2=o.bb.y2;
    }
  }
  if(!(bb.x2>bb.x1)) bb.x1=bb.y1=0, bb.x2=bb.y2=1000;
  b.bounds=bb;

  // 铜层集合（图层面板用）：默认 1~32 + 39~54，实际以数据里出现的为准
  const seenCu=new Set();
  for(const o of b.all) if(o.cu && o.cu!=="all") o.cu.forEach(l=>seenCu.add(l));
  b.copper=[...seenCu].sort((x,y)=>x-y);
  if(!b.copper.length) b.copper=[1,32];

  // 按层分桶（渲染用，含非铜层）
  b.bucket = new Map();
  const push=(ly,o,kind)=>{
    if(!b.bucket.has(ly)) b.bucket.set(ly,[]);
    b.bucket.get(ly).push({o,kind});
  };
  b.tracks.forEach(o=>push(o.layer,o,"track"));
  b.arcs.forEach(o=>push(o.layer,o,"arc"));
  b.pads.forEach(o=>push(o.layer,o,"pad"));
  b.fills.forEach(o=>push(o.layer,o,"fill"));
  b.vias.forEach(o=>push(74,o,"via"));
  b.polys.forEach(o=>push(o.layer,o,"polygon"));
  b.texts.forEach(o=>push(o.layer,o,"text"));

  /* 覆铜归属：填充线（track/arc/fill）记录 +11 处存着自己属于哪块覆铜
     （-1 = 普通走线）。按 polygon 编号分组，点中一片覆铜就能整片点亮，
     而不是一点一条线。层不匹配的丢掉，防止不同层复用同一编号时串台。 */
  b.polyById = new Map();
  for(const p of b.polys) if(!b.polyById.has(p.pid)) b.polyById.set(p.pid,p);
  b.byPoly = new Map();
  for(const o of b.all){
    if(!(o.poly>=0)) continue;
    const p=b.polyById.get(o.poly);
    if(!p) continue;
    if(o.layer!==p.layer && o.layer!==74) continue;
    let a=b.byPoly.get(o.poly); if(!a) b.byPoly.set(o.poly,a=[]);
    a.push(o);
  }

  const byLy={};
  b.bucket.forEach((arr,ly)=>{ byLy[ly]=arr.length; });
  b.countByLayer=byLy;

  // 连通性空间索引：只登记铜层上的图元
  b.cuIdx=buildIndex(b.all);

  // 网络号 -> 图元
  b.byNet = new Map();
  for(const o of b.all){
    if(!(o.net>0)) continue;
    let a=b.byNet.get(o.net); if(!a) b.byNet.set(o.net,a=[]);
    a.push(o);
  }
  b.netCount=b.byNet.size;

  /* 元件位号 / 型号
     该格式把它们当两条 Text 存在 Texts 段里：记录末尾 +301=1 的是位号（U3），
     +300=1 的是型号（AMS1117-3.3），两条都带元件号（+13）。据此就能把
     "丝印上那串字"认到"哪个元件"头上 —— 这是"查线不知道两端是什么元件"的解药。 */
  b.compInfo = new Map();
  const cleanTxt=s=>(s||"").replace(/\u0000/g,"").replace(/^\s+|\s+$/g,"");
  for(const t of b.texts){
    if(t.comp<0) continue;
    let ci=b.compInfo.get(t.comp);
    if(!ci){ ci={des:"",com:"",x:t.x,y:t.y,h:t.h,layer:t.layer,id:t.comp}; b.compInfo.set(t.comp,ci); }
    const s=cleanTxt(t.text);
    if(!s) continue;
    if(t.isDes && !ci.des){ ci.des=s; ci.x=t.x; ci.y=t.y; ci.h=t.h; ci.layer=t.layer; }
    else if(t.isCom && !ci.com){ ci.com=s; }
  }
  /* 兜底：有些版本 / 导出方式不给 +300、+301 置位，但板上明明印着型号。
     这时按文本形态补：
       · U5 / R37 / C23 / CON106 / Q1A 这种「字母+数字」→ 位号
       · AMS1117-3.3 / 10uF/10V / 10K / 0.1uF 这种       → 型号 / 值
     每个元件最多补一条，不覆盖第一遍按标志位认到的结果。 */
  const likeDes=/^[A-Za-z]{1,4}\d{1,4}[A-Za-z]?$/;
  for(const t of b.texts){
    if(t.comp<0) continue;
    const ci=b.compInfo.get(t.comp);
    if(!ci) continue;
    const s=cleanTxt(t.text);
    if(!s) continue;
    if(likeDes.test(s)){
      if(!ci.des){ ci.des=s; ci.x=t.x; ci.y=t.y; ci.h=t.h; ci.layer=t.layer; }
    }else if(!ci.com){
      ci.com=s;
    }
  }
  // 每个焊盘记住自己属于哪个位号，查线时才能写成 "U3-3"
  for(const p of b.pads){
    const ci=b.compInfo.get(p.comp);
    p.compDes = ci ? ci.des : "";
  }
  /* 元件占位框：用该元件所有焊盘的外包矩形（比丝印图元可靠 ——
     老设计的丝印常常东一段西一段、还混着文字）。 */
  for(const p of b.pads){
    if(p.comp<0) continue;
    const ci=b.compInfo.get(p.comp);
    if(!ci) continue;
    const r=Math.max(p.xs||0,p.ys||0)/2;   // 旋转后取外接半径，宁可稍大
    const x1=p.x-r, x2=p.x+r, y1=p.y-r, y2=p.y+r;
    if(!ci.bb) ci.bb={x1,y1,x2,y2};
    else{
      ci.bb.x1=Math.min(ci.bb.x1,x1); ci.bb.y1=Math.min(ci.bb.y1,y1);
      ci.bb.x2=Math.max(ci.bb.x2,x2); ci.bb.y2=Math.max(ci.bb.y2,y2);
    }
  }
  b.desCount = 0; b.valCount = 0;
  b.compInfo.forEach(c=>{ if(c.des) b.desCount++; if(c.com) b.valCount++; });
}

function buildIndex(all){
  const G=50, map=new Map();
  let skipped=0;
  all.forEach((o,i)=>{
    if(!o.cu || !o.bb) return;
    const gx1=Math.floor(o.bb.x1/G), gx2=Math.floor(o.bb.x2/G);
    const gy1=Math.floor(o.bb.y1/G), gy2=Math.floor(o.bb.y2/G);
    if((gx2-gx1+1)*(gy2-gy1+1) > 4096){ skipped++; return; }
    for(let gx=gx1;gx<=gx2;gx++)
      for(let gy=gy1;gy<=gy2;gy++){
        const k=gx+"_"+gy;
        let a=map.get(k); if(!a) map.set(k,a=[]);
        a.push(i);
      }
  });
  if(skipped) console.warn(T("idxSkip", skipped));
  return {G,map};
}

/* 从种子图元出发，找出电气上真正相连的铜。
   只走铜层，只认实际接触（间距 ≤ EPS），圆弧按真实弧段参与判断。 */
function traceCu(seedIdx){
  const all=B.all, idx=B.cuIdx, G=idx.G;
  const seen=new Set([seedIdx]), out=[seedIdx], stack=[seedIdx];
  let guard=0;
  while(stack.length && guard++<800000){
    const i=stack.pop(), o=all[i];
    if(!o || !o.bb) continue;
    const gx1=Math.floor(o.bb.x1/G), gx2=Math.floor(o.bb.x2/G);
    const gy1=Math.floor(o.bb.y1/G), gy2=Math.floor(o.bb.y2/G);
    for(let gx=gx1;gx<=gx2;gx++)
      for(let gy=gy1;gy<=gy2;gy++){
        const arr=idx.map.get(gx+"_"+gy);
        if(!arr) continue;
        for(const j of arr){
          if(seen.has(j)) continue;
          const p=all[j];
          if(!shareCu(o,p)) continue;
          if(entDist(o,p) > EPS) continue;
          seen.add(j); out.push(j); stack.push(j);
        }
      }
  }
  return out;
}

/* ============================== 渲染 ============================== */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const stage=document.getElementById("stage");
let B=null;
let view={s:1, ox:0, oy:0};
let hi=null;                      // 高亮键（网络号 / 几何组）
let LIT=null;                     // 命中的图元集合
let pickMode="";
let cuBig=0, netTouch=0, litPads=0, litVias=0;
let litFeet=[], litFeetAll=0;     // 这次点亮了哪些元件脚（U3-3 / R12-1 …）
let show={};
let solo=null;
let invert=false, showLabels=true, dimOthers=true, trueWidth=true;
let showDes=true;                 // 元件位号（U3 / R12…）
let showVal=true;                 // 元件型号（AMS1117-3.3…）—— 维修认芯片主要靠这个
let showPour=true;                // 是否显示覆铜（接地平面铺满整板，看走线时要能关掉）
let mouseDown=false, moving=false, lastX=0, lastY=0, downX=0, downY=0;

const LAYER_COLORS={
  1:"#e2504f", 2:"#c9622f", 3:"#b8853a", 4:"#8f9f3f", 5:"#5aa87a",
  6:"#3fa9a0", 7:"#4a8ee8", 8:"#7b6ce0", 9:"#b45ec9", 10:"#d4537e"
};
function layerColor(n){
  if(n===32) return "#4a8ee8";                 // 底层：蓝（和顶层红配成一套）
  if(n>=2 && n<=31) return "#9a7ad0";
  if(n>=39 && n<=54) return "#9a7ad0";
  if(n===1) return "#e2504f";
  if(n===74) return "#b9c2d0";
  if(n===33||n===34) return "#8a8a8a";
  if(n===56) return "#7a6a3a";
  return "#5c6373";
}
function layerLabel(n){
  const nm=(B&&B.layers&&B.layers[n])||"";
  let s;
  if(n===1) s=T("layTop");
  else if(n===32) s=T("layBottom");
  else if(n===74) s=T("layVia");
  else if(n===33) s=T("layTopSilk");
  else if(n===34) s=T("layBotSilk");
  else if(n===56) s=T("layKeep");
  else if(n>=39&&n<=54) s=T("layPlane", n-38);
  else if(n>=57&&n<=72) s=T("layMech", n-56);
  else s=(nm||stdLayerName(n));
  // 文件里自己给层起的别名（LAYERnNAME）；跟标准名重复就不啰嗦一遍
  return (nm && nm.toLowerCase()!==String(stdLayerName(n)).toLowerCase()) ? s+" · "+nm : s;
}
function isCopper(n){ return (B&&B.copper.includes(n)); }

/* 是不是"铺铜的实体"（覆铜面生成出来的填充线/弧，和大块矩形铜填充）。
   ⚠ 只有 track / arc / fill 三种记录带 polygon 编号（+11）；
     焊盘、过孔没有这个字段，o.poly 是 undefined —— 用 `o.poly>=0` 判断
     会漏掉所有焊盘/过孔（undefined>=0 恒为 false），点接地就变成"0 颗脚"。
   fill（矩形铜填充）一律算铺铜：老设计里接地平面经常就是一片片 fill 拼的，
   它们要是参与高亮，点一下接地又是整板发黄。 */
function isPourPart(o){
  if(!o) return false;
  if(o.kind==="fill") return true;
  return (o.kind==="track"||o.kind==="arc") && o.poly>=0;
}

function resize(){
  const dpr=window.devicePixelRatio||1;
  const r=stage.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  cv.style.width=r.width+"px"; cv.style.height=r.height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function w2s(x,y){ return [x*view.s+view.ox, -y*view.s+view.oy]; }

function fit(){
  if(!B) return;
  const r=stage.getBoundingClientRect();
  const W=Math.max(r.width||0, stage.clientWidth||0, 160);
  const H=Math.max(r.height||0, stage.clientHeight||0, 160);
  const bb=B.bounds;
  const w=Math.max(1,bb.x2-bb.x1), h=Math.max(1,bb.y2-bb.y1);
  const pad=70;
  let s=Math.min((W-pad)/w,(H-pad)/h);
  if(!isFinite(s)||s<=0) s=1;
  view.s=s;
  view.ox=W/2-(bb.x1+w/2)*view.s;
  view.oy=H/2+(bb.y1+h/2)*view.s;
  zoomLabel(); draw();
}

function visible(n){
  if(solo!==null) return n===solo;
  return show[n]!==false;
}

function draw(){
  const r=stage.getBoundingClientRect();
  ctx.fillStyle=invert?"#f0eee8":"#0d0f12";
  ctx.fillRect(0,0,r.width,r.height);
  if(!B) return;

  const layers=[...B.bucket.keys()];
  // 丝印/机械最底 → 铜层（底层先、顶层后）→ 过孔最上
  const rank=n=> n===74?3:(isCopper(n)?2:1);
  const order=layers.slice().sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    return b-a;
  });

  for(const ly of order){
    if(!visible(ly)) continue;
    drawLayer(ly,B.bucket.get(ly));
  }
  drawTexts(order);
  drawLabels(order);
  drawScale(r);
}

function drawTexts(order){
  ctx.globalAlpha=dimOthers&&hi?0.2:0.72;
  ctx.font="10px ui-monospace,Consolas,monospace";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle=invert?"#3a4150":"#8b94a5";
  for(const ly of order){
    if(!visible(ly)) continue;
    const arr=B.bucket.get(ly);
    for(let k=0;k<arr.length;k++){
      const it=arr[k];
      if(it.kind!=="text") continue;
      const o=it.o;
      if(o.isDes||o.isCom) continue;        // 位号/型号由 drawLabels 画，别重复
      if(!o.text||o.text.length>16) continue;
      const p=w2s(o.x,o.y);
      if(p[0]<-70||p[0]>cv.clientWidth+70||p[1]<-20||p[1]>cv.clientHeight+20) continue;
      ctx.fillText(o.text,p[0],p[1]-(o.h||30)/2*view.s);
    }
  }
  ctx.globalAlpha=1;
}

function drawLayer(ly,arr){
  const col=layerColor(ly);
  const DIM=dimOthers&&hi?0.12:1;
  const isCu=isCopper(ly);
  const topCu = isCu && B.copper.length>1 && ly===B.copper[0];
  const baseA=(ly===74)?1:(isCu?(topCu?0.78:0.95):0.45);

  const normal=[], lit=[];
  for(let k=0;k<arr.length;k++){
    const it=arr[k];
    if(it.kind==="text") continue;
    /* 覆铜（面 + 它的几千条填充线）可以整体关掉：接地平面铺满整板，
       不关的话底下的细走线根本看不见。 */
    if(!showPour && (it.kind==="polygon" || isPourPart(it.o))) continue;
    const on = LIT ? LIT.has(it.o) : (hi && it.o.hkey===hi);
    if(on) lit.push(it); else normal.push(it);
  }

  /* ---- 覆铜面 ----
     老设计的接地平面在文件里是几千条紧挨着的填充线，单看线条分不清
     "这整片是一块铜"，所以平时用一层极淡的底纹 + 一圈轮廓把区域框出来。
     ⚠ 被点中时**绝不能实心填充**：接地平面几乎铺满整板，一填就把走线、
       焊盘全盖住，满屏一个颜色什么也看不出来。只把轮廓描亮，真正的
       信息（哪些焊盘/过孔接地）交给上面的高亮。 */
  for(let k=0;k<arr.length;k++){
    const it=arr[k];
    if(it.kind!=="polygon") continue;
    if(!showPour) continue;
    const o=it.o, pts=o.pts;
    if(!pts || pts.length<3) continue;
    const on = LIT ? LIT.has(o) : false;
    if(on){
      ctx.globalAlpha=0.045*DIM; ctx.fillStyle="#ffe066";
    }else{
      ctx.globalAlpha=0.085*DIM; ctx.fillStyle=col;
    }
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const q=w2s(pts[i][0],pts[i][1]);
      i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=on?0.95:0.30*DIM;
    ctx.strokeStyle=on?"#ffd23f":col;
    ctx.lineWidth=on?1.8:0.7;
    ctx.stroke();
  }

  // ---- 走线 / 圆弧 / 填充：描边 ----
  const strokePass=(list,alpha,widthBoost,bright)=>{
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=bright?"#ffe066":col;
    ctx.lineCap="round";
    const groups=new Map();
    for(let k=0;k<list.length;k++){
      const it=list[k], o=it.o;
      if(it.kind==="fill"){
        ctx.globalAlpha=alpha*0.55;
        ctx.fillStyle=bright?"#ffe066":col;
        const pts=o.pts; if(!pts) continue;
        ctx.beginPath();
        for(let i=0;i<pts.length;i++){
          const q=w2s(pts[i][0],pts[i][1]);
          i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);
        }
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha=alpha;
        continue;
      }
      if(it.kind!=="track"&&it.kind!=="arc") continue;
      const w=trueWidth?Math.max(o.w||0,0):0;
      if(!groups.has(w)) groups.set(w,[]);
      groups.get(w).push(o);
    }
    for(const [w,objs] of groups){
      ctx.lineWidth=Math.max(0.6, w*view.s*(widthBoost||1));
      ctx.beginPath();
      for(const o of objs){
        if(o.kind==="track" && o.x1!==undefined){
          const a=w2s(o.x1,o.y1), b=w2s(o.x2,o.y2);
          ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
        }else if(o.radius!==undefined){
          /* 圆弧。这里有两个坑，都会在拐角处画出尖刺：
             ① moveTo 必须落在「弧的起点」上。以前用起始角算位置、却从结束角
                开始画，两者不重合，canvas 就会自动补一条弦 —— 拐角上那一堆
                放射状的毛刺就是这么来的。
             ② 起止角相同时是整圆，否则弧长为 0，什么都不画。 */
          const c=w2s(o.x,o.y);
          const rr=Math.max(0.5,Math.abs(o.radius||0)*view.s);
          let a1=+o.a1, a2=+o.a2;
          if(!isFinite(a1)||!isFinite(a2)) continue;
          if(a2<a1) a2+=360;
          let span=a2-a1;
          if(!(span>0)) span=360;
          if(span>360) span=360;
          const s0=(-a1*Math.PI)/180;
          const s1=s0-(span*Math.PI)/180;
          if(span>=359.9){
            ctx.moveTo(c[0]+rr,c[1]);
            ctx.arc(c[0],c[1],rr,0,Math.PI*2,false);
          }else{
            ctx.moveTo(c[0]+rr*Math.cos(s0), c[1]+rr*Math.sin(s0));
            ctx.arc(c[0],c[1],rr,s0,s1,true);
          }
        }
      }
      ctx.stroke();
    }
  };

  /* 未选中的图元。覆铜的填充线单独一组：高亮时它们也在"其余"里，
     但若跟着一起压到 0.12，整块板会黑掉成一团（接地平面铺满整板），
     所以只压到 0.45 —— 既压下去突出了亮黄的对象，又还看得出板子。 */
  const pourN=[], restN=[];
  for(const it of normal) (isPourPart(it.o) ? pourN : restN).push(it);
  if(pourN.length) strokePass(pourN, baseA*(dimOthers&&hi?0.45:1), 1, false);
  if(restN.length) strokePass(restN, baseA*DIM, 1, false);

  // ---- 焊盘 / 过孔：填充 ----
  const fillPass=(list,alpha,bright)=>{
    ctx.globalAlpha=alpha;
    for(let k=0;k<list.length;k++){
      const it=list[k], o=it.o;
      if(it.kind==="pad"){
        const p=w2s(o.x,o.y);
        const rx=Math.max(0.55,o.xs/2*view.s), ry=Math.max(0.55,o.ys/2*view.s);
        ctx.fillStyle=bright?"#ffe066":"#d8a13a";
        ctx.strokeStyle=bright?"#ffe066":"#a97b26";
        ctx.lineWidth=0.6;
        if(o.shape===1){
          // 圆/椭圆：按旋转角摆正。90°/270° 时等于 rx/ry 互换。
          ctx.beginPath();
          ctx.ellipse(p[0],p[1],rx,ry,-(o.rot||0)*Math.PI/180,0,Math.PI*2);
          ctx.fill();
          if(rx>1.6&&ry>1.6) ctx.stroke();
        }else{
          const pts=o.pts;
          if(pts){
            ctx.beginPath();
            for(let i=0;i<pts.length;i++){
              const q=w2s(pts[i][0],pts[i][1]);
              i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);
            }
            ctx.closePath(); ctx.fill();
            if(rx>1.6&&ry>1.6) ctx.stroke();
          }
        }
        if(o.hole>0 && o.hole/2*view.s>1.1){
          ctx.globalAlpha=alpha*0.92;
          ctx.fillStyle=invert?"#f0eee8":"#0d0f12";
          ctx.beginPath();
          ctx.arc(p[0],p[1],Math.max(0.8,o.hole/2*view.s),0,Math.PI*2);
          ctx.fill();
          ctx.globalAlpha=alpha;
        }
      }else if(it.kind==="via"){
        const p=w2s(o.x,o.y);
        ctx.fillStyle=bright?"#ffe066":"#b9c2d0";
        ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(1,o.dia/2*view.s),0,Math.PI*2); ctx.fill();
        if(o.hole/2*view.s>0.9){
          ctx.fillStyle=invert?"#f0eee8":"#0d0f12";
          ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.6,o.hole/2*view.s),0,Math.PI*2); ctx.fill();
        }
      }
    }
  };
  if(normal.length) fillPass(normal,baseA*DIM,false);

  if(lit.length){
    /* 覆铜的填充线有几千条，接地平面又铺满整板：**不能**按"命中"那么亮去画，
       否则满屏一个颜色，反而看不出任何东西。
         · 填充线（poly>=0）→ 压暗成"底色"，把 GND 的范围衬托出来
         · 真正连到它的走线/焊盘/过孔 → 全亮（这才是维修要看的）
       配合上面覆铜面只描轮廓，效果就是：整片 GND 变暗、边界清楚、
       接地的元件脚一颗颗亮黄。 */
    const pourLit=[], realLit=[];
    for(const it of lit) (isPourPart(it.o) ? pourLit : realLit).push(it);
    if(pourLit.length) strokePass(pourLit, dimOthers?0.34:baseA, 1.0, false);
    if(realLit.length){
      strokePass(realLit,1,1.4,true);
      fillPass(realLit,1,true);
    }
  }
  ctx.globalAlpha=1;
}

/* 标注层：元件位号 / 型号 / 焊盘编号。
   字号固定按屏幕像素算（不随缩放变），否则缩小时糊成一团、放大时针尖大。
   再带一层矩形碰撞检测：位置重叠的字直接不画 —— 这既能让全板视图清爽，
   又天然实现了"缩小时只留位号、放大后才冒出焊盘号"的效果。 */
function drawLabels(order){
  const W=cv.clientWidth, H=cv.clientHeight;
  const boxes=[];
  const free=(x,y,w,h)=>{
    for(let i=0;i<boxes.length;i++){
      const b=boxes[i];
      if(x<b.x+b.w && x+w>b.x && y<b.y+b.h && y+h>b.y) return false;
    }
    boxes.push({x,y,w,h});
    return true;
  };
  ctx.textAlign="center"; ctx.textBaseline="middle";

  /* ① 元件位号（描圆角底衬，压在覆铜上也读得清）+ 型号 */
  if(showDes && B.compInfo){
    /* 先画一圈虚线占位框，让人一眼看出这颗元件占了多大地方。
       缩得太小时框会糊成一片，所以只在放大到一定程度才画。 */
    if(view.s>=0.45){
      ctx.setLineDash([4,3]);
      ctx.lineWidth=1;
      ctx.strokeStyle=invert?"#7f8fa3":"#79a6c9";
      for(const ci of B.compInfo.values()){
        if(!ci.bb) continue;
        const a=w2s(ci.bb.x1,ci.bb.y2), c=w2s(ci.bb.x2,ci.bb.y1);
        const w=c[0]-a[0], h=c[1]-a[1];
        if(w<6||h<6) continue;
        ctx.globalAlpha=0.55;
        ctx.strokeRect(a[0],a[1],w,h);
      }
      ctx.setLineDash([]);
      ctx.globalAlpha=1;
    }

    for(const ci of B.compInfo.values()){
      if(!ci.des) continue;
      const p=w2s(ci.x,ci.y);
      if(p[0]<-60||p[0]>W+60||p[1]<-30||p[1]>H+30) continue;
      ctx.font="bold 12px ui-monospace,Consolas,monospace";
      const tw=Math.round(ctx.measureText(ci.des).width)+10;
      if(!free(p[0]-tw/2,p[1]-9,tw,18)) continue;
      ctx.globalAlpha=0.88;
      ctx.fillStyle=invert?"#fffdf5":"#101419";
      ctx.fillRect(p[0]-tw/2,p[1]-9,tw,18);
      ctx.globalAlpha=0.95;
      ctx.strokeStyle=invert?"#b8912a":"#8a7024";
      ctx.lineWidth=1;
      ctx.strokeRect(p[0]-tw/2+0.5,p[1]-8.5,tw-1,17);
      ctx.fillStyle=invert?"#6d4f00":"#ffd23f";
      ctx.fillText(ci.des,p[0],p[1]+0.5);

      /* 型号 / 值：维修认芯片主要靠它。优先放位号正下方；那里被别的标注占了
         就试位号右边、再试左边，都放不下才跳过（宁可没有，也别糊成一团）。 */
      if(showVal && ci.com){
        ctx.font="10px ui-monospace,Consolas,monospace";
        const s=ci.com.length>18 ? ci.com.slice(0,17)+"…" : ci.com;
        const vw=Math.round(ctx.measureText(s).width)+8, vh=13;
        const cand=[
          [Math.round(p[0]-vw/2), Math.round(p[1]+9)],                 // 正下方
          [Math.round(p[0]+tw/2+3), Math.round(p[1]-vh/2)],            // 右边
          [Math.round(p[0]-tw/2-vw-3), Math.round(p[1]-vh/2)]          // 左边
        ];
        for(const c of cand){
          if(!free(c[0],c[1],vw,vh)) continue;
          ctx.globalAlpha=0.92;
          ctx.fillStyle=invert?"#ffffff":"#0b0f14";
          ctx.fillRect(c[0],c[1],vw,vh);
          ctx.globalAlpha=1;
          ctx.fillStyle=invert?"#26303d":"#c8d3e0";
          ctx.fillText(s,c[0]+vw/2,c[1]+vh/2+0.5);
          break;
        }
      }
    }
  }

  /* ② 焊盘编号 */
  if(showLabels){
    ctx.font="9px ui-monospace,Consolas,monospace";
    for(const ly of order){
      if(!visible(ly)) continue;
      const arr=B.bucket.get(ly);
      for(let k=0;k<arr.length;k++){
        const it=arr[k];
        if(it.kind!=="pad") continue;
        const o=it.o;
        if(!o.name) continue;
        const t=o.name;
        if(t.length>4) continue;
        const p=w2s(o.x,o.y);
        if(p[0]<-20||p[0]>W+20||p[1]<-20||p[1]>H+20) continue;
        const w=Math.round(ctx.measureText(t).width)+4;
        if(!free(p[0]-w/2,p[1]-5.5,w,11)) continue;
        ctx.globalAlpha=0.95;
        ctx.fillStyle=invert?"#2b3542":"#e6ecf6";
        ctx.fillText(t,p[0],p[1]+0.5);
      }
    }
  }
  ctx.globalAlpha=1;
}

function drawScale(r){
  const want=90;
  let mil=want/view.s;
  const pow=Math.pow(10,Math.floor(Math.log10(mil)));
  const cand=[1,2,5,10].map(m=>m*pow);
  let pick=cand[0];
  for(const c of cand) if(c<=mil) pick=c;
  const px=pick*view.s;
  const x=r.width-px-24, y=r.height-24;
  ctx.globalAlpha=0.85;
  ctx.strokeStyle=invert?"#6b7484":"#5c6373"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+px,y);
  ctx.moveTo(x,y-4); ctx.lineTo(x,y+4);
  ctx.moveTo(x+px,y-4); ctx.lineTo(x+px,y+4);
  ctx.stroke();
  ctx.fillStyle=invert?"#5c6373":"#8b94a5";
  ctx.font="10px ui-monospace,monospace"; ctx.textAlign="center";
  ctx.fillText(pick>=1000?(pick/1000)+" in":pick+" mil", x+px/2, y-9);
  ctx.globalAlpha=1;
}

/* ============================== 交互 ============================== */
function hitTest(sx,sy){
  if(!B) return null;
  const wx=(sx-view.ox)/view.s, wy=-(sy-view.oy)/view.s;
  const tol=tolPx()/view.s;
  let best=null,bestScore=Infinity;

  for(const ly of B.bucket.keys()){
    if(!visible(ly)) continue;
    const arr=B.bucket.get(ly);
    for(let k=0;k<arr.length;k++){
      const it=arr[k];
      if(it.kind==="text") continue;
      if(!showPour && (it.kind==="polygon" || isPourPart(it.o))) continue;
      const o=it.o;
      let score=Infinity;
      if(o.segs){
        let d=Infinity;
        for(const s of o.segs){
          const q=ptSeg(wx,wy,s[0],s[1],s[2],s[3]);
          if(q<d) d=q;
        }
        const lim=(trueWidth?(o.w||0)/2:0)+tol;
        if(d<=lim) score=(d+ (it.kind==="arc"?2:0))*view.s;
      }else if(o.pts){
        let d=0;
        if(!ptInPoly(wx,wy,o.pts)){
          d=Infinity;
          for(let i=0,j=o.pts.length-1;i<o.pts.length;j=i++){
            const q=ptSeg(wx,wy,o.pts[j][0],o.pts[j][1],o.pts[i][0],o.pts[i][1]);
            if(q<d) d=q;
          }
        }
        if(d<=tol){
          // 焊盘优先（查线通常从焊盘起）；覆铜面垫在最底下，
          // 否则点在覆铜上永远只选中"面"，选不到具体那条走线。
          const bias = it.kind==="polygon" ? 6 : -1;
          score=(d+bias)*view.s;
        }
      }
      if(score < Infinity && !o.cu) score += 3*view.s;   // 丝印/禁布/机械层排在铜后面
      if(score<bestScore){ bestScore=score; best={o,it}; }
    }
  }
  return best;
}
function tolPx(){ return view.s>4?9:7; }

/* 鼠标扫过焊盘时在光标旁标出 "U100-3" —— 不用点就能认出是哪颗芯片的哪只脚。
   只比焊盘（几十到几百个），不碰几千条走线，所以不会拖慢鼠标。 */
function padAt(wx,wy){
  if(!B || B.pads.length>4000) return null;
  let best=null,bd=Infinity;
  for(const p of B.pads){
    const dx=wx-p.x, dy=wy-p.y;
    const rx=Math.max(p.xs,p.ys)/2+4;
    if(Math.abs(dx)<=rx && Math.abs(dy)<=rx){
      const d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=p; }
    }
  }
  return best;
}
function hoverTip(wx,wy,sx,sy){
  const el=document.getElementById("tip");
  const p=padAt(wx,wy);
  if(!p || (!p.compDes && !p.name)){ el.style.display="none"; return; }
  let t;
  if(p.compDes){
    t="<b>"+p.compDes+"</b>"+(p.name? "-"+p.name : "");
    const ci=B.compInfo && B.compInfo.get(p.comp);
    if(ci && ci.com){
      const s=ci.com.length>20? ci.com.slice(0,19)+"…" : ci.com;
      t+=' <span class="v">'+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>';
    }
  }else{
    t=T("padNo",(p.name||""));
  }
  if(el.dataset.k!==t){ el.innerHTML=t; el.dataset.k=t; }
  el.style.display="block";
  el.style.left=Math.min(sx+14, cv.clientWidth-180)+"px";
  el.style.top=Math.max(4, sy-28)+"px";
}

function pickAt(sx,sy){
  const h=hitTest(sx,sy);
  curHit=h;
  if(!h){ hi=null; LIT=null; pickMode=""; updateStatus(null); draw(); return; }
  const o=h.o;
  const idx=(typeof o._i==="number")?o._i:-1;   // 覆铜面不在 B.all 里
  pickMode=""; cuBig=0; netTouch=0; litPads=0; litVias=0;

  /* 丝印 / 禁布 / 机械层：不导电，追不到任何东西。
     以前走过去也只会亮它自己，看上去就像"线断了"——直接说清楚。 */
  if(!o.cu && o.kind!=="polygon"){
    LIT=new Set([o]); pickMode="noncu"; hi="g";
    updateStatus(h); draw(); return;
  }

  /* ① 点中的是覆铜（面本身，或属于覆铜的那几千条填充线）
     —— 这是大面积接地的正确呈法：
        · 覆铜只描一圈亮轮廓（它铺满整板，涂亮等于什么都没说）
        · 真正点亮的是这块铜所属网络上的元件脚（焊盘/过孔）和独立走线
        · 填充线一律不进高亮集合，否则整板一个颜色 */
  if(o.kind==="polygon" || isPourPart(o)){
    const pid = (o.kind==="polygon") ? o.pid : o.poly;
    const pol = B.polyById.get(pid) || null;
    const pn  = pol ? pol.net : (o.net>0 ? o.net : 0);
    const set = new Set();
    if(pn>0 && B.byNet.has(pn)){
      for(const q of B.byNet.get(pn)){
        if(isPourPart(q)) continue;    // 填充线不算"看得见的信息"
        set.add(q);
      }
    }else if(typeof o._i==="number"){
      let g=[];
      try{ g=traceCu(o._i); }catch(e){ g=[]; }
      for(const k of g){
        const q=B.all[k];
        if(!q || isPourPart(q)) continue;
        set.add(q);
      }
    }
    if(pol) set.add(pol);              // 面放进 LIT → 描亮轮廓
    /* 地/电源网络上的走线常有几十上百条：全亮等于把那一片涂黄，
       和"整板显示"没区别。超过阈值就只留元件脚，铜皮靠轮廓 + 原色。 */
    let nt=0;
    for(const q of set) if(q.kind==="track") nt++;
    if(nt>60){
      const keep=new Set();
      for(const q of set) if(q.kind==="pad"||q.kind==="via") keep.add(q);
      if(pol) keep.add(pol);
      set.clear(); for(const q of keep) set.add(q);
    }
    for(const q of set){ if(q.kind==="pad") litPads++; else if(q.kind==="via") litVias++; }
    LIT=set;
    pickMode="cu-pour";
    hi = pn>0 ? ("n"+pn) : "g";
    updateStatus(h); draw(); return;
  }

  // ② 点中的是普通图元：按网络号 / 实际铜皮连通追
  /* 先按网络号（文件自带语义，最准）。
     但接地/电源这类网络的图元可能成百上千条（地平面用粗线拼的），
     全亮就是"整板一个颜色"，所以超过阈值只留元件脚。 */
  if(o.net>0 && B.byNet.has(o.net)){
    const set=new Set();
    let nt=0, np=0, nv=0, hasPour=false;
    for(const q of B.byNet.get(o.net)){
      if(isPourPart(q)){ hasPour=true; continue; }
      set.add(q);
      if(q.kind==="track") nt++; else if(q.kind==="pad") np++; else if(q.kind==="via") nv++;
    }
    /* 走线特别多的网络（地/电源）只留元件脚。
       普通信号网一般 2~20 条，全亮才看得清 —— 阈值 60 留足余量。 */
    if(nt>60){
      /* 大面积网络：只亮元件脚 + 自己点的这一条 */
      const keep=new Set([o]);
      for(const q of set) if(q.kind==="pad"||q.kind==="via") keep.add(q);
      LIT=keep; pickMode="big-net"; litPads=np; litVias=nv;
    }else{
      LIT=set; pickMode="net";
    }
    hi="n"+o.net;
    updateStatus(h); draw(); return;
  }

  const polys=new Set();
  const polysHit=new Set();

  // ② 按实际铜皮连通追
  let group=[idx];
  if(idx>=0){ try{ group=traceCu(idx); }catch(e){ group=[idx]; } }

  // ③ 覆铜扩片：组里任何一条填充线带着 polygon 编号，就把整块覆铜并进来。
  //    这是"底层大面积接地只亮一点一条线"的正解 —— 覆铜的铜是几千条
  //    填充线，只亮命中的那一条等于什么都没说明。
  for(const k of group){
    const q=B.all[k];
    if(q && q.poly>=0 && B.byPoly.has(q.poly)) polys.add(q.poly);
  }
  for(const pid of polys){
    const p=B.polyById.get(pid);
    if(p) polysHit.add(p);
    for(const q of (B.byPoly.get(pid)||[])) group.push(q._i);
  }
  const nets=new Set();
  for(const k of group){
    const q=B.all[k];
    if(q && q.net>0) nets.add(q.net);
  }
  netTouch=nets.size;

  // ④ 没碰到覆铜时才向外扩整个网络（碰到覆铜再扩会把整板 GND 都点亮，
  //    反而看不出是哪一片铜，维修时更没用）
  let only=0;
  if(!polysHit.size && nets.size===1){
    only=[...nets][0];
    for(const q of (B.byNet.get(only)||[])) group.push(q._i);
  }

  const uniq=new Set();
  /* 覆铜的填充线不进高亮集合：它们是"铜的实体"，有几千条，
     全亮起来整板就是一块颜色。高亮留给走线、焊盘、过孔。 */
  for(const k of group){ const q=B.all[k]; if(q && !isPourPart(q)) uniq.add(q); }
  for(const p of polysHit) uniq.add(p);
  LIT=uniq;

  /* 点一条没有网号的线，它要是接在地平面上，traceCu 会顺藤摸瓜把整片 GND
     都摸出来（几百条铜线）—— 全亮就是"点哪儿都整板发黄"。
     这种情况只保留元件脚 + 自己点中的这一条，铜皮靠轮廓和原色显示。 */
  if(polysHit.size){
    let nt=0;
    LIT.forEach(q=>{ if(q.kind==="track") nt++; });
    if(nt>60){
      const keep=new Set([o]);
      LIT.forEach(q=>{
        if(q.kind==="pad"){ keep.add(q); litPads++; }
        else if(q.kind==="via"){ keep.add(q); litVias++; }
      });
      for(const p of polysHit) keep.add(p);
      LIT=keep; pickMode="cu-pour";
    }
  }

  // ⑤ 兜底：只有真到"上万处"才收缩。以前 900 处就砍，
  //    于是所有接地平面都只剩一条线，这是 bug 不是保护。
  if(LIT.size>20000){
    cuBig=LIT.size; pickMode="cu-big";
    LIT=new Set([o]);
    for(const p of polysHit) LIT.add(p);
  }else{
    pickMode = polysHit.size ? "cu-pour"
             : nets.size>1 ? "cu-multi"
             : (only?"cu-net":"cu");
  }
  if(polysHit.size){
    let nn=0;
    for(const p of polysHit) if(p.net>0) nn=p.net;
    hi = nn>0 ? ("n"+nn) : "g";
  }else{
    hi = only ? ("n"+only) : "g";
  }
  updateStatus(h);
  draw();
}

/* 老的 pick(sx,sy) 名字保留，调试 hash 里还在用 */
function pick(sx,sy){ pickAt(sx,sy); }

function netNameOf(key){
  if(!key) return "";
  if(typeof key==="string" && key[0]==="n"){
    const i=parseInt(key.slice(1),10);
    return (B.nets[i-1]||("NET"+i));
  }
  return T("noNet");
}

function updateStatus(h){
  /* 先把这次点亮的焊盘换成"U3-3 / R12-1"这样的脚位 —— 维修时最想知道的就是
     "这条线从哪颗元件的哪只脚出来、到哪颗元件的哪只脚去"，光看一条黄线没用。 */
  litFeet=[]; litFeetAll=0;
  if(LIT){
    const seen=new Set(), arr=[];
    for(const q of LIT){
      if(q.kind!=="pad") continue;
      const s=q.compDes ? (q.compDes+(q.name? "-"+q.name : "")) : (q.name? T("padNo",q.name) : "");
      if(!s || seen.has(s)) continue;
      seen.add(s); arr.push(s);
    }
    arr.sort();
    /* 点中的那只脚排最前面 —— 查线的人先看"我从哪只脚出发"。 */
    if(h && h.o && h.o.kind==="pad" && h.o.compDes){
      const s=h.o.compDes+(h.o.name? "-"+h.o.name : "");
      const i=arr.indexOf(s);
      if(i>0){ arr.splice(i,1); arr.unshift(s); }
    }
    litFeetAll=arr.length;
    litFeet=arr.slice(0,5);
  }
  const sn=document.getElementById("stNet");
  if(!h){ sn.innerHTML=""; document.getElementById("stLayer").textContent="—";
    document.getElementById("stWidth").textContent="—"; return; }
  const o=h.o;
  document.getElementById("stLayer").textContent=layerLabel(o.layer||74);
  document.getElementById("stWidth").textContent=
    (o.w!==undefined?o.w.toFixed(1)+" mil"
     :(o.xs!==undefined?o.xs.toFixed(0)+"×"+o.ys.toFixed(0)+" mil"
     :(o.dia!==undefined?o.dia.toFixed(0)+" mil":"—")));
  const n=LIT?LIT.size:0;
  let tag="", tail=" · "+T("places", n);
  if(pickMode==="net") tag=T("tagNet");
  else if(pickMode==="noncu") tag=T("tagNonCu");
  else if(pickMode==="cu-net") tag=T("tagCuNet");
  else if(pickMode==="cu") tag=T("tagCu");
  else if(pickMode==="cu-multi") tag=T("tagCuMulti", netTouch);
  else if(pickMode==="cu-pour"){
    /* 点的是接地平面。这里报"接地的元件脚有几颗"才是有用的信息，
       报"整片 7332 处"没意义（整板就铺着这一片铜）。 */
    tag=T("tagCuPour", litPads, litVias);
    tail="";
  }
  else if(pickMode==="big-net"){
    /* 接地/电源这种大面积网络：几百条铜线全亮等于整板涂黄，只报元件脚 */
    tag=T("tagBigNet", litPads, litVias);
    tail="";
  }
  else if(pickMode==="cu-big") tag=T("tagCuBig", cuBig);
  else if(pickMode==="comp"){ tag=T("tagComp", n); tail=""; }
  else if(pickMode==="probe"){ tag=T("tagProbe"); tail=""; }
  const padName = (o.kind==="pad" && o.name && !o.compDes)
    ? ('<span class="chip blue">'+T("padNo",o.name)+'</span>') : "";
  /* 点亮的元件脚 —— 这是查线的答案本身，放在网络名后面第一位 */
  let feet="";
  if(litFeetAll){
    const show=litFeet.join(" / ");
    const more=litFeetAll>litFeet.length ? " +"+(litFeetAll-litFeet.length) : "";
    feet='<span class="chip blue" title="'+T("feetTitle")+'">'+show+more+'</span>';
  }
  sn.innerHTML = '<span class="chip'+(pickMode==="cu-multi"?' warn':'')+'">'+netNameOf(hi)+'</span>'
    + feet
    + padName
    + (tag? '<span class="chip">'+tag+tail+'</span>' : '');
}

/* 缩放：以鼠标所在点为中心（专业绘图软件都是这个手感，鼠标指着的地方不动）。
   锚定算法：屏幕坐标 sx = 世界坐标 x*s + ox ⇒ 要让 sx 处的 x 保持不变，
   新 ox' = sx - x*s'，也就是 ox' = sx - (sx-ox)*k。 */
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  if(!B) return;
  const r=cv.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  // deltaMode=1 是"按行滚动"（部分鼠标驱动），换算成像素
  const dy=e.deltaMode===1 ? e.deltaY*16 : (e.deltaMode===2 ? e.deltaY*400 : e.deltaY);
  const k=Math.exp(-dy*0.0022);
  const ns=Math.max(0.002,Math.min(900,view.s*k));
  const f=ns/view.s;
  view.ox=sx-(sx-view.ox)*f;
  view.oy=sy-(sy-view.oy)*f;
  view.s=ns;
  draw(); zoomLabel();
},{passive:false});

cv.addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  mouseDown=true; moving=false;
  downX=e.clientX; downY=e.clientY;
  lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect();
  if(B){
    const wx=(e.clientX-r.left-view.ox)/view.s;
    const wy=-(e.clientY-r.top-view.oy)/view.s;
    document.getElementById("stCoord").textContent=
      wx.toFixed(0)+", "+wy.toFixed(0);
    if(!mouseDown) hoverTip(wx,wy,e.clientX-r.left,e.clientY-r.top);
  }
  if(!mouseDown) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>4) moving=true;
  if(moving){
    view.ox+=dx; view.oy+=dy;
    lastX=e.clientX; lastY=e.clientY;
    draw();
  }
});
window.addEventListener("mouseup",e=>{
  if(!mouseDown) return;
  mouseDown=false;
  if(!moving && B){
    const r=cv.getBoundingClientRect();
    const sx=e.clientX-r.left, sy=e.clientY-r.top;
    if(probeOn) probeClick(sx,sy); else pickAt(sx,sy);
  }
  moving=false;
});
cv.addEventListener("dblclick",()=>{ hi=null; LIT=null; updateStatus(null); draw(); });

/* 平移：按屏幕像素走，一次 90px（按住 Shift 走 320px，快速跨板）。
   之所以不改世界坐标，是因为不管缩放到几倍，"按一下挪一屏的十分之一"
   手感都一样。 */
function panBy(dx,dy){
  if(!B) return;
  view.ox+=dx; view.oy+=dy; draw();
}
function panStep(e){
  const s=(e && e.shiftKey) ? 320 : 90;
  return s;
}
function centerView(){
  if(!B) return;
  if(!B.bb){ fit(); return; }
  const bb=B.bb;
  view.ox=cv.clientWidth/2-(bb.x1+bb.x2)/2*view.s;
  view.oy=cv.clientHeight/2+(bb.y1+bb.y2)/2*view.s;
  draw();
}
const navpad=document.getElementById("navpad");
navpad.addEventListener("click",e=>{
  const b=e.target.closest("button[data-nav]");
  if(!b) return;
  const s=90;
  const d=b.dataset.nav;
  if(d==="up")    panBy(0, s);
  else if(d==="down")  panBy(0,-s);
  else if(d==="left")  panBy(s, 0);
  else if(d==="right") panBy(-s,0);
  else if(d==="center") centerView();
});

/* 缩放：以视口中心为锚点（键盘 +/- 用）。
   滚轮缩放锚在鼠标位置，键盘没有鼠标位置，用中心最符合直觉。 */
function zoomAt(sx,sy,k){
  const ns=Math.max(0.002,Math.min(900,view.s*k));
  const f=ns/view.s;
  view.ox=sx-(sx-view.ox)*f;
  view.oy=sy-(sy-view.oy)*f;
  view.s=ns;
  draw(); zoomLabel();
}

/* ---------- 弹窗：使用说明 / 免责声明 / 关于 ---------- */
const MODALS=["help","disc","about"];
function openModal(name){
  MODALS.forEach(n=>{
    const el=document.getElementById("mo-"+n);
    if(el) el.classList.toggle("show", n===name);
  });
}
function closeModals(){
  MODALS.forEach(n=>{
    const el=document.getElementById("mo-"+n);
    if(el) el.classList.remove("show");
  });
}
function anyModalOpen(){
  return MODALS.some(n=>{
    const el=document.getElementById("mo-"+n);
    return el && el.classList.contains("show");
  });
}
document.querySelectorAll("[data-modal]").forEach(b=>{
  b.onclick=()=>openModal(b.dataset.modal);
});
document.querySelectorAll("[data-close]").forEach(b=>{

});
document.querySelectorAll(".modal").forEach(m=>{
  // 点遮罩空白处关闭（点内容框不关）
  m.addEventListener("mousedown",e=>{ if(e.target===m) closeModals(); });
});

/* ---------- 语言切换 ----------
   按钮上永远显示「对方」的语言名：中文界面显示 EN，英文界面显示 中文。
   这样两边的人都认得自己该点哪个，不会出现"看不懂的汉字"。 */
function toggleLang(){
  lang = (lang==="zh") ? "en" : "zh";
  try{ localStorage.setItem("copperlens.lang", lang); }catch(_){}
  applyLang();
  // 状态栏里现在那串标签是上一个语言写的，重新生成一遍
  if(LIT) updateStatus(curHit);
  draw();
}
document.getElementById("lang").onclick=toggleLang;
let curHit=null;    // 当前高亮的命中对象（切语言时重写状态栏要用）

window.addEventListener("keydown",e=>{
  // 弹窗打开时只认 Esc
  if(anyModalOpen()){
    if(e.key==="Escape") closeModals();
    return;
  }
  const tag=(e.target && e.target.tagName)||"";
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;
  const k=e.key;
  if((k==="f"||k==="F") && (e.ctrlKey||e.metaKey)){
    e.preventDefault(); findInput.focus(); findInput.select(); return;
  }
  if(k==="f"||k==="F"){ fit(); return; }
  if(k==="h"||k==="H"){ togglePour(); return; }
  if(k==="k"||k==="K"){ toggleProbe(); return; }
  if(k==="Escape"){
    if(probeOn){ exitProbe(); return; }
    hi=null; LIT=null; pickMode=""; curHit=null; updateStatus(null); draw(); return;
  }
  // 方向键平移 / +- 缩放
  const s=panStep(e);
  if(k==="ArrowUp"){    panBy(0, s);  e.preventDefault(); return; }
  if(k==="ArrowDown"){  panBy(0,-s);  e.preventDefault(); return; }
  if(k==="ArrowLeft"){  panBy(s, 0);  e.preventDefault(); return; }
  if(k==="ArrowRight"){ panBy(-s,0);  e.preventDefault(); return; }
  if(k==="+"||k==="=") { zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.25); e.preventDefault(); return; }
  if(k==="-"||k==="_") { zoomAt(cv.clientWidth/2,cv.clientHeight/2,1/1.25); e.preventDefault(); return; }
  if(k==="0"){ centerView(); }
});

/* 覆铜开关：接地平面铺满整板，看细走线时一键关掉它 */
function togglePour(){
  showPour=!showPour;
  const b=document.getElementById("pour");
  if(b) b.classList.toggle("on",showPour);
  draw();
}

/* ============================== 层列表 ============================== */
function buildLayers(){
  const box=document.getElementById("layers");
  box.innerHTML="";
  if(!B) return;
  const lys=[...B.bucket.keys()].sort((a,b)=>{
    const ca=isCopper(a)?0:(a===74?2:1), cb=isCopper(b)?0:(b===74?2:1);
    if(ca!==cb) return ca-cb;
    return a-b;
  });
  for(const n of lys){
    const d=document.createElement("div");
    d.className="layer"+(show[n]===false?" off":"")+(solo===n?" solo":"");
    const cnt=(B.countByLayer[n]||0);
    d.innerHTML='<span class="sw" style="background:'+layerColor(n)+'"></span>'+
      '<span class="nm">'+layerLabel(n)+'</span>'+
      '<span class="ct">'+cnt+'</span>';
    d.title=T("layerTitle");
    d.onclick=()=>{
      show[n]=show[n]===false;
      buildLayers(); draw();
    };
    d.ondblclick=ev=>{
      ev.stopPropagation();
      solo=(solo===n)?null:n;
      buildLayers(); draw();
    };
    box.appendChild(d);
  }
}

/* ============================== 图层快捷 ============================== */
/* 维修九成时间只看顶层和底层，一上来层层点开太慢，给四个一键操作。
   solo（双击单层）要先清掉，否则"全选"看着像没反应。 */
function layerBulk(kind){
  if(!B) return;
  const ns=[...B.bucket.keys()];
  if(kind==="all"){
    ns.forEach(n=>{ show[n]=true; });
  }else if(kind==="none"){
    ns.forEach(n=>{ show[n]=false; });
  }else if(kind==="cu"){
    /* 一键切到"只看顶层和底层"。这个组合要是幂等的：不管之前是全选还是
       全不选，点一下都得到同一个干净画面 —— 顶底铜 + 丝印 + 过孔。
       丝印必须留着，否则连位号都看不见；机械层/禁布保持用户原来的选择。 */
    ns.forEach(n=>{
      if(isCopper(n)) show[n]=(n===1||n===32);
      else if(n===33||n===34||n===74) show[n]=true;
    });
  }else if(kind==="inv"){
    ns.forEach(n=>{ show[n]=(show[n]===false); });
  }
  solo=null;
  buildLayers(); draw();
}
document.getElementById("lybar").addEventListener("click",e=>{
  const b=e.target.closest("button[data-ly]");
  if(b) layerBulk(b.dataset.ly);
});

/* ============================== 找东西：位号 / 型号 / 网络 ============================== */
let FIND=[], findSel=-1, findHits=[];

/* 下拉里的文字来自文件，可能带 < > 之类的字符，插进 innerHTML 前先转义 */
function esc(s){
  return String(s).replace(/[&<>"]/g,c=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function buildFind(){
  FIND=[];
  if(!B) return;
  B.compInfo.forEach(ci=>{
    const k=ci.des||ci.com;
    if(!k) return;
    FIND.push({t:"c", k:k, sub:(ci.des&&ci.com)?ci.com:"", ci:ci});
  });
  B.nets.forEach((nm,i)=>{ if(nm) FIND.push({t:"n", k:nm, sub:"", id:i+1}); });
}

function findMatches(q){
  q=(q||"").trim().toLowerCase();
  if(!q) return [];
  const exact=[], pre=[], mid=[];
  for(const f of FIND){
    const k=f.k.toLowerCase();
    if(k===q) exact.push(f);
    else if(k.indexOf(q)===0) pre.push(f);
    else if(k.indexOf(q)>0) mid.push(f);
  }
  const cmp=(a,b)=>a.k.length-b.k.length;
  return exact.sort(cmp).concat(pre.sort(cmp), mid.sort(cmp)).slice(0,40);
}

function renderFind(){
  const box=document.getElementById("findList");
  const q=document.getElementById("find").value;
  if(!q.trim()){ box.classList.remove("show"); box.innerHTML=""; findHits=[]; findSel=-1; return; }
  findHits=findMatches(q);
  findSel=findHits.length?0:-1;
  if(!findHits.length){
    box.innerHTML='<div class="empty">'+T("findNone")+'</div>';
    box.classList.add("show");
    return;
  }
  let html="", grp="";
  findHits.forEach((f,i)=>{
    const g=(f.t==="c")?T("findGrpComp"):T("findGrpNet");
    if(g!==grp){ grp=g; html+='<div class="grp">'+g+'</div>'; }
    html+='<div class="it'+(i===findSel?" sel":"")+'" data-i="'+i+'">'
      + '<span class="k">'+esc(f.k)+'</span>'
      + '<span class="s">'+(f.sub?esc(f.sub):"")+'</span>'
      + '<span class="tag">'+(f.t==="c"?T("findTagComp"):T("findTagNet"))+'</span>'
      + '</div>';
  });
  box.innerHTML=html;
  box.classList.add("show");
}

function bboxOfSet(set){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  for(const o of set){
    if(!o.bb) continue;
    x1=Math.min(x1,o.bb.x1); y1=Math.min(y1,o.bb.y1);
    x2=Math.max(x2,o.bb.x2); y2=Math.max(y2,o.bb.y2);
  }
  return isFinite(x1)?{x1:x1,y1:y1,x2:x2,y2:y2}:null;
}

/* 把视野对准一个矩形（找元件、找网络时用） */
function focusBox(bx){
  if(!bx) return;
  const W=cv.clientWidth||800, H=cv.clientHeight||600, pad=110;
  const w=Math.max(8,bx.x2-bx.x1), h=Math.max(8,bx.y2-bx.y1);
  const s=Math.min((W-pad)/w,(H-pad)/h);
  view.s=Math.max(0.002,Math.min(900,s));
  view.ox=W/2-(bx.x1+w/2)*view.s;
  view.oy=H/2+(bx.y1+h/2)*view.s;
  zoomLabel(); draw();
}

/* 点亮一颗元件的全部焊盘 —— "图纸上写着 U100，板子上是哪一颗" */
function lightComp(ci){
  const set=new Set();
  for(const p of B.pads) if(p.comp===ci.id) set.add(p);
  if(!set.size) return false;
  LIT=set; hi="g"; pickMode="comp";
  curHit={o:[...set][0], it:null};
  updateStatus(curHit); draw();
  return true;
}

/* 点亮一整条网络（和鼠标点铜皮走同一条路，结果一致） */
function lightNet(n){
  if(!(n>0) || !B.byNet.has(n)) return false;
  const set=new Set(); let nt=0,np=0,nv=0;
  for(const q of B.byNet.get(n)){
    if(isPourPart(q)) continue;
    set.add(q);
    if(q.kind==="track") nt++; else if(q.kind==="pad") np++; else if(q.kind==="via") nv++;
  }
  if(!set.size) return false;
  if(nt>60){
    const keep=new Set();
    for(const q of set) if(q.kind==="pad"||q.kind==="via") keep.add(q);
    LIT=keep; pickMode="big-net"; litPads=np; litVias=nv;
  }else{
    LIT=set; pickMode="net"; litPads=np; litVias=nv;
  }
  hi="n"+n;
  curHit={o:[...set][0], it:null};
  updateStatus(curHit); draw();
  return true;
}

function doFind(f){
  document.getElementById("findList").classList.remove("show");
  if(!f) return;
  if(f.t==="c"){
    const ci=f.ci;
    focusBox(ci.bb || {x1:ci.x-40,y1:ci.y-40,x2:ci.x+40,y2:ci.y+40});
    if(!lightComp(ci)) toast(T("findNoPad", f.k));
  }else if(lightNet(f.id)){
    focusBox(bboxOfSet(LIT));
  }
}

const findInput=document.getElementById("find");
findInput.addEventListener("input",renderFind);
findInput.addEventListener("focus",()=>{ if(findInput.value.trim()) renderFind(); });
findInput.addEventListener("keydown",e=>{
  const box=document.getElementById("findList");
  if(e.key==="Escape"){ box.classList.remove("show"); findInput.blur(); e.stopPropagation(); return; }
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    if(!findHits.length) return;
    e.preventDefault();
    findSel=(findSel+(e.key==="ArrowDown"?1:-1)+findHits.length)%findHits.length;
    const items=[...box.querySelectorAll(".it")];
    items.forEach((el,i)=>el.classList.toggle("sel",i===findSel));
    const sel=box.querySelector(".it.sel");
    if(sel) sel.scrollIntoView({block:"nearest"});
    return;
  }
  if(e.key==="Enter"){
    e.preventDefault();
    if(findSel>=0) doFind(findHits[findSel]);
  }
});
document.getElementById("findList").addEventListener("click",e=>{
  const it=e.target.closest(".it");
  if(it) doFind(findHits[+it.dataset.i]);
});
document.addEventListener("mousedown",e=>{
  if(!e.target.closest(".findwrap")) document.getElementById("findList").classList.remove("show");
});

/* ============================== 通不通（两点连通检测） ============================== */
/* 维修最常问的一句话是"这两点通不通"。以前只能点一下看网络名，两边拼着看，
   网络号为 0 的板子还判断不了。这里给一个直接的答案。
   判定顺序：网表（最准）→ 同一片覆铜 → 实际铜皮连通（traceCu 追）。 */
let probeOn=false, probeA=null;

function endName(o){
  if(!o) return "—";
  if(o.kind==="pad"){
    if(o.compDes) return o.compDes+(o.name?"-"+o.name:"");
    if(o.name) return T("padNo",o.name);
    return T("lblPad");
  }
  if(o.kind==="via") return T("lblVia");
  if(o.kind==="polygon") return T("lblPour");
  return T("lblTrack");
}

function setProbe(html, cls){
  const bar=document.getElementById("probeBar");
  bar.innerHTML='<span class="rd '+(cls||"")+'">'+html+'</span>'
    + '<button class="x" title="Esc">✕</button>';
  bar.classList.add("show");
  bar.querySelector(".x").onclick=exitProbe;
}
function hideProbe(){ document.getElementById("probeBar").classList.remove("show"); }

function enterProbe(){
  if(!B){ toast(T("noBoard")); return; }
  probeOn=true; probeA=null;
  document.getElementById("probe").classList.add("on");
  setProbe(T("probeNeedA"), "warn");
}
function exitProbe(){
  probeOn=false; probeA=null;
  document.getElementById("probe").classList.remove("on");
  hideProbe();
  hi=null; LIT=null; pickMode=""; curHit=null;
  updateStatus(null); draw();
}
function toggleProbe(){ probeOn?exitProbe():enterProbe(); }
document.getElementById("probe").onclick=toggleProbe;

/* 判定两点是否电气相连 */
function checkJoin(a,b){
  if(a.net>0 && b.net>0){
    return a.net===b.net
      ? {ok:true, by:"net", net:a.net}
      : {ok:false, by:"net", n1:a.net, n2:b.net};
  }
  if(a.poly>=0 && a.poly===b.poly) return {ok:true, by:"poly"};
  if(typeof a._i==="number" && typeof b._i==="number"){
    let s=null;
    try{ s=new Set(traceCu(a._i)); }catch(e){ s=null; }
    if(s && s.has(b._i)) return {ok:true, by:"cu"};
  }
  return {ok:false, by:"cu"};
}

function lightProbe(a,b,res){
  const set=new Set([a,b]);
  if(res.ok && res.by==="net"){ lightNet(res.net); return; }
  if(res.ok){
    for(const o of [a,b]){
      if(typeof o._i!=="number") continue;
      try{
        for(const k of traceCu(o._i)){
          const q=B.all[k];
          if(q && !isPourPart(q)) set.add(q);
        }
      }catch(e){}
    }
    if(set.size>3000){
      const keep=new Set([a,b]);
      for(const q of set) if(q.kind==="pad"||q.kind==="via") keep.add(q);
      LIT=keep;
    }else{
      LIT=set;
    }
  }else{
    LIT=set;
  }
  hi="g"; pickMode="probe"; curHit={o:b, it:null};
  updateStatus(curHit); draw();
}

function probeClick(sx,sy){
  const h=hitTest(sx,sy);
  if(!h){ return; }
  const o=h.o;
  if(!o.cu && o.kind!=="polygon"){
    setProbe(T("probeNoCu"), "warn");
    return;
  }
  if(!probeA){
    probeA=o;
    LIT=new Set([o]); hi="g"; pickMode="probe"; curHit=h;
    updateStatus(h); draw();
    setProbe(T("probeNeedB", endName(o)), "warn");
    return;
  }
  const a=probeA, b=o;
  const res=checkJoin(a,b);
  const na=endName(a), nb=endName(o);
  if(res.ok){
    if(res.by==="net") setProbe(T("probeOkNet", na, nb, netNameOf("n"+res.net)), "ok");
    else if(res.by==="poly") setProbe(T("probeOkPoly", na, nb), "ok");
    else setProbe(T("probeOkCu", na, nb), "ok");
  }else{
    const n1=(a.net>0?netNameOf("n"+a.net):""), n2=(o.net>0?netNameOf("n"+o.net):"");
    setProbe(T("probeNo", na, nb, n1, n2), "bad");
  }
  lightProbe(a, o, res);
  probeA=null;      // 下一次点击重新开始
}

/* ============================== 存图 ============================== */
/* 维修单要配图、工作群要发证据：一键把当前画面（含位号和高亮）存成 PNG。 */
function saveShot(){
  if(!B){ toast(T("noBoard")); return; }
  try{
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    const ts=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"
           +p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
    const base=String(lastName||"board").replace(/[\\/:*?"<>|]/g,"_").replace(/\.(pcb|ddb)$/i,"");
    const a=document.createElement("a");
    a.download=base+"_"+ts+".png";
    a.href=cv.toDataURL("image/png");
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(T("shotDone", a.download));
  }catch(err){
    toast(T("shotFail")+err.message);
  }
}
document.getElementById("shot").onclick=saveShot;

/* ============================== 载入 ============================== */
function loadBuffer(buf,name){
  toast("");
  try{
    const t0=performance.now();
    B=parseBoard(buf);
    const dt=Math.round(performance.now()-t0);
    lastName=name; lastMs=dt;
    show={}; solo=null; hi=null; LIT=null; pickMode="";
    probeOn=false; probeA=null;
    document.getElementById("probe").classList.remove("on");
    hideProbe();
    const fi=document.getElementById("find");
    if(fi) fi.value="";
    document.getElementById("findList").classList.remove("show");
    document.getElementById("hint").style.display="none";
    refreshFileLine();
    buildLayers();
    buildFind();
    requestAnimationFrame(()=>{
      fit();
      // 定位到指定坐标：#zoom=x,y,倍数（看细节时直接改地址栏就行）
      // #pick=x,y,倍数 定位并直接点亮该处铜皮（把链接发给别人就能直接看那条线）
      let mp=location.hash.match(/^#pick=(-?[\d.]+),(-?[\d.]+),([\d.]+)$/);
      const mm=mp||location.hash.match(/^#zoom=(-?[\d.]+),(-?[\d.]+),([\d.]+)$/);
      if(mm){
        view.s=+mm[3];
        view.ox=cv.clientWidth/2-(+mm[1])*view.s;
        view.oy=cv.clientHeight/2+(+mm[2])*view.s;
        draw();
        if(mp){ const p=w2s(+mp[1],+mp[2]); pickAt(p[0],p[1]); }
      }
      runDemo();
    });
    if(B.warn.length) toast(T("segWarn")+B.warn.join("; "));
  }catch(err){
    B=null;
    document.getElementById("hint").style.display="";
    toast(T("openFail")+err.message);
  }
}

/* 调试用：#demo 点一条有网络的走线；#trace 点一条没网络的走线 */
function runDemo(){
  const h=location.hash;
  if(h!=="#demo"&&h!=="#trace") return;
  if(!B) return;
  setTimeout(()=>{
    if(!B||!B.tracks.length) return;
    const L=o=>Math.hypot(o.x2-o.x1,o.y2-o.y1);
    const want = h==="#demo" ? (o=>o.cu&&o.net>0) : (o=>o.cu&&!(o.net>0));
    const t=B.tracks.filter(o=>want(o)&&L(o)>200).sort((a,c)=>L(c)-L(a))[0]
       || B.tracks.filter(want)[0] || B.tracks[0];
    view.s = Math.min(9, Math.max(1.6, 340/Math.max(1,L(t))));
    view.ox = cv.clientWidth/2 - (t.x1+t.x2)/2*view.s;
    view.oy = cv.clientHeight/2 + (t.y1+t.y2)/2*view.s;
    const p=w2s((t.x1+t.x2)/2,(t.y1+t.y2)/2);
    pickAt(p[0],p[1]);
    const nT=B.tracks.filter(o=>LIT.has(o)).length;
    const nP=B.pads.filter(o=>LIT.has(o)).length;
    const nV=B.vias.filter(o=>LIT.has(o)).length;
    document.getElementById("stStats").textContent =
      T("demoLine", LIT.size, nT, nP, nV) +
      (pickMode==="net" ? T("tagNet")+" "+netNameOf(hi) : pickMode);
  },250);
}

function zoomLabel(){
  document.getElementById("stZoom").textContent=Math.round(view.s*100)+"%";
}

let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  if(!msg){ t.className="toast"; return; }
  t.textContent=msg; t.className="toast show";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className="toast",7000);
}

/* 统一入口：按钮选择、拖进窗口、拖到图标（由 exe 处理）最后都走这里。
   .ddb 在浏览器里解不了，先拦下来给一句人话，不要让它掉进 parseBoard 里报
   一句"可能不是 PCB 4.0 文件"——那样用户会以为文件坏了。 */
function openLocalFile(f){
  if(!f) return;
  const nm=f.name||"board.pcb";
  if(/\.ddb$/i.test(nm)){ toast(T("ddbWeb")); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    BOARDS=[{n:nm,d:null,buf:fr.result}];
    syncBoardSelect();
    loadBuffer(fr.result,nm);
  };
  fr.onerror=()=>toast(nm+" — "+T("readFail"));
  fr.readAsArrayBuffer(f);
}
document.getElementById("open").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  openLocalFile(e.target.files[0]);
  e.target.value="";          /* 清掉，否则同一个文件第二次选不触发 change */
};

const hint=document.getElementById("hint");
["dragenter","dragover"].forEach(ev=>stage.addEventListener(ev,e=>{
  e.preventDefault(); hint.classList.add("over");
}));
["dragleave","drop"].forEach(ev=>stage.addEventListener(ev,e=>{
  e.preventDefault(); hint.classList.remove("over");
}));
stage.addEventListener("drop",e=>{
  openLocalFile(e.dataTransfer.files[0]);
});

document.getElementById("fit").onclick=fit;
document.getElementById("invert").onclick=function(){
  invert=!invert; this.classList.toggle("on",invert); draw();
};
document.getElementById("labels").onclick=function(){
  showLabels=!showLabels; this.classList.toggle("on",showLabels); draw();
};
document.getElementById("des").onclick=function(){
  showDes=!showDes; this.classList.toggle("on",showDes); draw();
};
document.getElementById("optVal").onclick=function(){
  showVal=!showVal; this.classList.toggle("on",showVal); draw();
};
document.getElementById("pour").onclick=togglePour;
document.getElementById("optDim").onclick=function(){

};
document.getElementById("optPen").onclick=function(){
  trueWidth=!trueWidth; this.classList.toggle("on",trueWidth); draw();
};
document.getElementById("optDim").classList.add("on");
document.getElementById("optPen").classList.add("on");
document.getElementById("optVal").classList.add("on");

window.addEventListener("resize",resize);
resize();

/* 语言：优先用上次选过的；没选过就跟系统语言走（非中文系统默认英文）。
   必须在载入板子之前定下来，状态栏第一行才不会闪一下中文。 */
try{
  const sv=localStorage.getItem("copperlens.lang");
  if(sv==="zh"||sv==="en") lang=sv;
  else if(!/^zh/i.test(navigator.language||"")) lang="en";
}catch(_){}
applyLang();

/* ===================== 多板切换（DDB 里有好几块板时） ===================== */
let BOARDS=[];
let curBoard=-1;

function b64ToBuf(s){
  const bin=atob(s);
  const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return u8.buffer;
}
function syncBoardSelect(){
  const sel=document.getElementById("boards");
  sel.innerHTML="";
  if(BOARDS.length<2){ sel.style.display="none"; return; }
  BOARDS.forEach((bd,i)=>{
    const op=document.createElement("option");
    op.value=i; op.textContent=bd.n;
    sel.appendChild(op);
  });
  sel.style.display="";
  sel.value=Math.max(0,curBoard);
}
document.getElementById("boards").onchange=function(){
  const i=+this.value;
  if(i===curBoard) return;
  const bd=BOARDS[i];
  if(!bd) return;
  curBoard=i;
  let buf=bd.buf;
  if(!buf && bd.d){ buf=b64ToBuf(bd.d); bd.d=null; bd.buf=buf; }
  if(buf) loadBuffer(buf,bd.n);
};

/* 数据来源，按优先级：
   ① 桌面版 exe 会把板子以 base64 内嵌在 __BOARDS__ / __EMBED_DATA__ 里 ——
      不走网络，不受 file:// 的跨域限制，双击就能看；
   ② ?f=文件名 主动指定；
   ③ 同目录的 demo_converter.pcb（确认工具本身正常）。 */
(async()=>{
  try{
    if(window.__BOARDS__ && window.__BOARDS__.length){
      BOARDS=window.__BOARDS__.map(x=>({n:x.n,d:x.d,buf:null}));
      curBoard=0;
      syncBoardSelect();
      const buf=b64ToBuf(BOARDS[0].d);
      const nm=BOARDS[0].n;
      BOARDS[0].d=null; BOARDS[0].buf=buf;
      loadBuffer(buf,nm);
      return;
    }
    if(typeof window.__EMBED_DATA__==="string" && window.__EMBED_DATA__){
      const buf=b64ToBuf(window.__EMBED_DATA__);
      const nm=window.__EMBED_NAME__||"board";
      window.__EMBED_DATA__=null;
      BOARDS=[{n:nm,d:null,buf:buf}];
      syncBoardSelect();
      loadBuffer(buf,nm);
      return;
    }
  }catch(e){ toast(T("embedFail")+e.message); }

  /* ④ 网页版 / 在线版：没有内嵌数据，就停在这儿等用户自己把文件拖进来。
        hint 里的引导文案由 applyLang() 按 isWebMode() 自动选，这里不用管。
        以前这里会去 fetch 同目录的 demo_converter.pcb，部署到网上会白报 404，
        改成只有显式写了 ?f= 才去取（本地调试用）。 */
  const want=new URLSearchParams(location.search).get("f");
  if(want && want!=="none"){
    try{
      const r=await fetch(want,{cache:"no-store"});
      if(r.ok){
        const buf=await r.arrayBuffer();
        if(buf.byteLength>0){ BOARDS=[{n:want,d:null,buf:buf}]; syncBoardSelect(); loadBuffer(buf,want); }
      }
    }catch(_){}
  }
})();
</script>
